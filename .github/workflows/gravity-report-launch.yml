name: Verify and stage Gravity Report newsletter
on:
  push:
    branches:
      - 'feature/gravity-report-*'
    paths:
      - ".github/workflows/gravity-report-launch.yml"
      - "functions/gravity-report/**"
      - "site/**"
      - "site/gravity-report-thanks.html"
      - "scripts/test-gravity-report.mjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch staged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate newsletter function source and content
        run: |
          node --check functions/gravity-report/index.mjs
          node scripts/test-gravity-report.mjs
      - name: Regenerate source integrity manifest and verify deployment build
        run: |
          node scripts/update-manifest.cjs
          npm run build
      - name: Save verified source manifest to staged feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(report): synchronize verified newsletter publication manifest'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
