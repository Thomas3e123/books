name: Gravity integrated stability checks
on:
  push:
    branches:
      - audit/integrated-stability-release-2026-11-07
  pull_request:
    branches:
      - feature/gravity-migration-phase1-2026-10-22
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - 'source-manifest.json'
      - '.github/workflows/gravity-integrated-stability.yml'
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integrated repairs
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: JavaScript syntax
        run: |
          node --check scripts/build-gravity-production.cjs
          node --check scripts/build-handbook.mjs
          node --check site/assets/js/gravity-work-study-v2.js
          node --check site/assets/js/gravity-shift-lab.js
          node --check site/apps/inventory-center/assets/js/inventory-center.js
      - name: Run four storage and cache regression suites
        run: |
          node --test \
            tests/gravity-production-cache.test.cjs \
            tests/work-study-storage-safety.test.cjs \
            tests/inventory-export-safety.test.cjs \
            tests/shift-lab-storage-protection.test.cjs
      - name: Verify that preview suppression cannot stop production builds
        run: node --test tests/netlify-ignore-preview.test.cjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check real Free Resources ZIP, PDF and Word file integrity
        run: python3 scripts/audit-free-resource-files.py
      - name: Verify manifest and compile site
        run: npm run build
      - name: Modern Guide rate-limit adapter regressions
        run: node --test tests/gravity-guide-rate-limit.test.cjs tests/gravity-ai-boundary.test.cjs
      - name: Audio rate-limit adapter and binary compatibility regressions
        run: node --test tests/gravity-audio-rate-limits.test.cjs
      - name: Synthetic account and restaurant isolation regressions
        run: node --test tests/gravity-cloud-account-isolation.test.cjs tests/gravity-foundry-tenant-isolation.test.cjs
      - name: Browser encryption and recovery passphrase regressions
        run: node --test tests/gravity-cloud-crypto-recovery.test.cjs
      - name: Existing rollback and automatic-upload safety regressions
        run: node --test tests/cloud-restore-failure.test.cjs tests/cloud-upload-pause.test.cjs
      - name: Real database adapter tenant query scopes
        run: node --test tests/gravity-db-tenant-query-scopes.test.cjs
      - name: Audit AI security boundaries without provider requests
        run: node --test tests/gravity-ai-boundary.test.cjs
      - name: Audit batch 1 knowledge and Testing Room regressions
        run: node --test tests/gravity-audit-batch1.test.cjs
      - name: Employee poster filter and navigation regressions
        run: node --test tests/gravity-poster-filter.test.cjs
      - name: Protect independent Gravity Report navigation from System menu injection
        run: node --test tests/gravity-report-navigation-boundary.test.cjs
      - name: Verify Gravity and TMB remain separate in Windows tools, QR output and manuals
        run: node --test tests/gravity-tmb-separation.test.cjs
      - name: Regression test Windows package link boundaries
        run: node --test tests/gravity-windows-package-boundary.test.cjs
      - name: Verify Gravity APIs reject legacy publisher and arbitrary Netlify origins
        run: node --test tests/gravity-api-origin-boundary.test.cjs
      - name: Check offline API responses reject publisher origins and preserve Gravity traffic
        run: node scripts/test-gravity-domain-functions.cjs
      - name: Inventory remaining legacy publisher destinations (read-only audit)
        run: node scripts/audit-gravity-tmb-links.cjs --json
      - name: Verify Founding Year and paid-license export gates
        run: node scripts/test-handbook-public.mjs
      - name: Build final Gravity production files
        run: node scripts/build-gravity-production.cjs
      - name: Check versioned assets in final build
        run: |
          node - <<'NODE'
          const fs=require('node:fs'), assert=require('node:assert/strict');
          const home=fs.readFileSync('build/gravity-production/index.html','utf8');
          const aware=fs.readFileSync('build/gravity-production/gravity-aware.html','utf8');
          const inventory=fs.readFileSync('build/gravity-production/apps/inventory-center/index.html','utf8');
          assert.match(home, /assets\/js\/site\.js\?v=[a-f0-9]{16}/);
          assert.match(aware, /assets\/js\/gravity-quick-tools\.js\?v=[a-f0-9]{16}/);
          assert.match(inventory, /assets\/js\/inventory-center\.js\?v=[a-f0-9]{16}/);
          assert.match(home, /assets\/css\/styles\.css\?v=[a-f0-9]{16}/);
          console.log('Four final-output asset version checks passed.');
          NODE
