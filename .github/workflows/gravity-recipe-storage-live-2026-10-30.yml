name: Gravity Recipe Works safeguards — live customer browser confirmation
on:
  push:
    branches: [feature/gravity-migration-phase1-2026-10-22]
    paths:
      - .github/workflows/gravity-recipe-storage-live-2026-10-30.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-live-safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser test and validate source
        run: |
          node --check scripts/qa-gravity-recipe-storage-live.mjs
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Confirm production safeguards are published, not only staged
        run: |
          curl -fsSL --max-time 30 https://gravityleadershipsystem.com/gravity-recipe-works | grep -Fq "function recipeStorageWarning(message)"
          curl -fsSL --max-time 30 https://gravityleadershipsystem.com/gravity-recipe-works | grep -Fq "This will REPLACE all recipes"
      - name: Test live data recovery and storage failure with fictional data
        run: node scripts/qa-gravity-recipe-storage-live.mjs
      - name: Store human-readable report
        if: always()
        run: |
          set -euo pipefail
          test -s docs/audits/gravity-recipe-storage-live-2026-10-30.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/gravity-recipe-storage-live-2026-10-30.md
          if git diff --cached --quiet;then exit 0;fi
          git commit -m "audit(gravity): record live Recipe Works data safety verification [skip ci]"
          git fetch --no-tags origin feature/gravity-migration-phase1-2026-10-22
          git rebase origin/feature/gravity-migration-phase1-2026-10-22
          git push origin HEAD:feature/gravity-migration-phase1-2026-10-22
