name: Gravity AI Workbook 350 Build
on:
  push:
    branches:
      - feature/gravity-migration-phase1-2026-10-22
    paths:
      - '.github/workflows/gravity-ai-workbook-350.yml'
      - 'scripts/build-ai-prompt-workbook.py'
      - 'scripts/publish-ai-prompt-workbook-site.py'
      - 'scripts/ai-prompts-326-350.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gravity-ai-workbook-350
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document dependencies
        run: python -m pip install python-docx reportlab pypdf
      - name: Build Word PDF index and reader text
        run: python scripts/build-ai-prompt-workbook.py
      - name: Update site references
        run: python scripts/publish-ai-prompt-workbook-site.py
      - name: Validate generated 350 prompt edition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('site/assets/data/restaurant-ai-prompts-350.json')
          rows=json.loads(p.read_text(encoding='utf-8'))
          assert len(rows)==350
          assert [x['id'] for x in rows]==[f'GRV-AI-{i:03d}' for i in range(1,351)]
          assert all(x.get('manager_check') for x in rows)
          print('350 prompts and all manager checks verified')
          PY
      - name: Commit verified generated edition
        run: |
          git config user.name "gravity-workbook-bot"
          git config user.email "gravity-workbook-bot@users.noreply.github.com"
          git add site/assets/data/restaurant-ai-prompts-350.json site/assets/reader/ai-prompts.txt site/assets/free-resources/ai/ site/assets/reader/catalog.json site/assets/js/ai-prompt-search.js site/assets/js/book-reader.js site/restaurant-ai-prompt-search.html site/book-reader.html site/books.html site/toolkit.html site/free-resources.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified 350-prompt Gravity workbook artifacts"
            git push
          fi
