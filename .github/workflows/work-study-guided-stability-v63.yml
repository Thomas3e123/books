name: Work Study Guided stability v63
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/gravity-work-study-lab.html'
      - 'site/windows-programs.html'
      - 'site/assets/js/gravity-work-study-mutation-guard-v62.js'
      - 'site/assets/js/gravity-work-study-guided-entry-v63.js'
      - 'site/assets/js/gravity-work-study-device-link-v1.js'
      - 'functions/work-study-link/**'
      - 'netlify/database/migrations/20261017183000_work_study_device_link.sql'
      - 'windows/gravity-work-study-lab/bootstrap.js'
      - 'windows/gravity-work-study-lab/device-link-main.js'
      - 'windows/gravity-work-study-lab/device-link.js'
      - 'windows/gravity-work-study-lab/preload.js'
      - 'windows/gravity-work-study-lab/index.html'
      - 'windows/gravity-work-study-lab/package.json'
      - 'scripts/patch-work-study-guided-stability.cjs'
      - 'scripts/work-study-guided-stability-suite.cjs'
      - 'scripts/work-study-guided-browser-smoke.cjs'
      - 'scripts/work-study-device-link-suite.cjs'
      - '.github/workflows/work-study-guided-stability-v63.yml'
permissions:
  contents: write
jobs:
  guided-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Guided stability layers on generated page
        run: node scripts/patch-work-study-guided-stability.cjs
      - name: Syntax check stability and portable-device layers
        run: |
          node --check site/assets/js/gravity-work-study-mutation-guard-v62.js
          node --check site/assets/js/gravity-work-study-guided-entry-v63.js
          node --check site/assets/js/gravity-work-study-device-link-v1.js
          node --check functions/work-study-link/index.mjs
          node --check windows/gravity-work-study-lab/bootstrap.js
          node --check windows/gravity-work-study-lab/device-link-main.js
          node --check windows/gravity-work-study-lab/device-link.js
          node --check windows/gravity-work-study-lab/preload.js
          node --check scripts/work-study-guided-stability-suite.cjs
          node --check scripts/work-study-guided-browser-smoke.cjs
          node --check scripts/work-study-device-link-suite.cjs
      - name: Run Guided stability regression
        run: node scripts/work-study-guided-stability-suite.cjs
      - name: Run all Work Study regression suites
        run: |
          set -e
          for f in scripts/work-study-*-suite.cjs; do
            if [ "$f" = "scripts/work-study-guided-browser-smoke.cjs" ]; then continue; fi
            echo "Running $f"
            node "$f"
          done
      - name: Install website browser smoke runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run actual website Guided responsiveness smoke
        run: |
          python3 -m http.server 4173 --directory site >/tmp/work-study-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          node scripts/work-study-guided-browser-smoke.cjs
      - name: Refresh controlled source manifest
        run: npm run manifest
      - name: Verify controlled site build
        run: npm run build
      - name: Commit verified Work Study generated page and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/gravity-work-study-lab.html source-manifest.json
          if git diff --cached --quiet; then
            echo 'Verified Work Study source already current.'
          else
            git commit -m 'Publish verified Work Study portable connection'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
