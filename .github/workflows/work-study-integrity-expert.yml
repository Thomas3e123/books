name: Work Study integrity expert

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/js/gravity-work-study-integrity-expert-v19.js'
      - 'scripts/work-study-integrity-expert-suite.cjs'
      - 'scripts/upgrade-work-study-lab-v2.cjs'
      - '.github/workflows/work-study-integrity-expert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrity-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check integrity expert syntax
        run: node --check site/assets/js/gravity-work-study-integrity-expert-v19.js
      - name: Run integrity expert regression suite
        run: node scripts/work-study-integrity-expert-suite.cjs
      - name: Install integrity expert in Work Study page
        run: node scripts/upgrade-work-study-lab-v2.cjs
      - name: Verify generated Work Study page
        run: |
          grep -q 'gravity-work-study-integrity-expert-v19.js?v=20261016-integrity-expert-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-earbud-mode-v18.js?v=20261016-guided-voice-v2' site/gravity-work-study-lab.html
          grep -q 'Gravity Study Integrity Check' site/assets/js/gravity-work-study-integrity-expert-v19.js
          grep -q 'Integrity Hold — Inconclusive' site/assets/js/gravity-work-study-integrity-expert-v19.js
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit generated Work Study page
        run: |
          if git diff --quiet -- site/gravity-work-study-lab.html source-manifest.json; then
            echo "Work Study integrity source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/gravity-work-study-lab.html source-manifest.json
          git commit -m "Install Work Study integrity expert"
          git pull --rebase origin main
          git push origin HEAD:main
