name: Gravity production candidate — offline QA only
on:
  push:
    branches:
      - 'feature/gravity-migration-phase1-*'
    paths:
      - 'scripts/prepare-gravity-production-candidate.cjs'
      - 'site/book-reader.html'
      - 'site/assets/css/book-reader.css'
      - 'scripts/gravity-navigation-consistency.cjs'
      - '.github/workflows/gravity-production-candidate-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install required Netlify function dependencies
        run: |
          npm ci
          node -e 'require.resolve("@netlify/database");console.log("Database function dependency available")'
      - name: Prepare offline candidate
        run: node scripts/prepare-gravity-production-candidate.cjs
      - name: Verify no staging banners or staging indexing blocks
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='build/gravity-production-candidate';
          const path=require('path');
          let pages=0, brokenLinks=[];
          function scan(dir){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
            const filename=path.join(dir,entry.name);
            if(entry.isDirectory()){scan(filename);continue;}
            if(!filename.endsWith('.html'))continue;
            pages++;
            const html=fs.readFileSync(filename,'utf8');
            if(html.includes('gravity-migration-preview-notice')||html.includes('GRAVITY MIGRATION PREVIEW — NOT LIVE FOR CUSTOMERS'))throw Error('Staging banner on '+filename);
            for(const match of html.matchAll(/(?:href|src)=["'](\/assets\/[^"'?#]+\.(?:pdf|zip|docx|xlsx|js|css))["'?#]/gi)){
              const target=path.join(p,decodeURIComponent(match[1]).slice(1));
              if(!fs.existsSync(target))brokenLinks.push(filename+': '+match[1]);
            }
          }}
          scan(p);
          if(pages<100)throw Error('Incomplete HTML candidate: '+pages);
          if(brokenLinks.length)throw Error('Missing local linked assets: '+brokenLinks.slice(0,15).join('; '));
          if(!fs.readFileSync(p+'/robots.txt','utf8').includes('Allow: /'))throw Error('Indexing still blocked');
          const domain='https://gravityleadershipsystem.com';
          for(const name of ['index.html','books.html','register.html','about.html','gravity-assist.html']){
            const html=fs.readFileSync(path.join(p,name),'utf8');
            if(html.includes('gravity-leadership-system.netlify.app'))throw Error('Staging identity leaked into public '+name);
            if(!html.includes(domain))throw Error('Public domain missing on '+name);
            if(/<meta[^>]+name=["']robots["'][^>]+noindex/i.test(html))throw Error('Public page unexpectedly noindex: '+name);
          }
          for(const name of ['apps/sop-foundry/employee-access.html','apps/sop-foundry/employee-app.html','apps/sop-foundry/workroom.html','apps/sop-foundry/staff-posters.html','testing-room-manager.html']){
            const html=fs.readFileSync(path.join(p,name),'utf8');
            if(!/<meta[^>]+name=["']robots["'][^>]+noindex/i.test(html))throw Error('Private page must remain noindex: '+name);
          }
          const sitemap=fs.readFileSync(path.join(p,'sitemap.xml'),'utf8');
          if(!sitemap.includes(domain+'/')||sitemap.includes('thomasmonroebooks.com')||sitemap.includes('gravity-leadership-system.netlify.app'))throw Error('Candidate sitemap host mismatch');
          console.log('OFFLINE CANDIDATE PASS — public canonical, private-page indexing and assets verified; NOT DEPLOYED');
          NODE
      - name: Prepare noindex review alias from production candidate
        run: |
          cp -a build/gravity-production-candidate build/gravity-release-review
          node - <<'NODE'
          const fs=require('fs'),path='build/gravity-release-review/_headers';
          fs.writeFileSync('build/gravity-release-review/robots.txt','User-agent: *'+String.fromCharCode(10)+'Disallow: /'+String.fromCharCode(10));
          let headers=fs.readFileSync(path,'utf8');
          const lines=headers.split(String.fromCharCode(10));
          const i=lines.findIndex(line=>line.trim()==='/*');
          if(i<0)throw Error('Missing wildcard headers stanza');
          lines.splice(i+1,0,'  X-Robots-Tag: noindex, nofollow');
          fs.writeFileSync(path,lines.join(String.fromCharCode(10)));
          // Review alias must keep navigation on this isolated, non-indexed deployment.
          const dir='build/gravity-release-review',target='https://gravity-release-review--gravity-leadership-system.netlify.app';
          function rewrite(folder){for(const item of fs.readdirSync(folder,{withFileTypes:true})){
            const p=require('path').join(folder,item.name);
            if(item.isDirectory()){rewrite(p);continue;}
            if(!/\.(html|xml)$/.test(p))continue;
            const before=fs.readFileSync(p,'utf8');
            fs.writeFileSync(p,before.replaceAll('https://gravityleadershipsystem.com',target));
          }}
          rewrite(dir);
          NODE
      - name: Deploy unpublished review alias (never production)
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          ALT_NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          ALT_NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          token="${NETLIFY_AUTH_TOKEN:-${ALT_NETLIFY_TOKEN:-${ALT_NETLIFY_ACCESS_TOKEN:-}}}"
          if [ -z "$token" ]; then
            echo 'Review alias not deployed: Netlify deployment token unavailable.'
            exit 0
          fi
          export NETLIFY_AUTH_TOKEN="$token"
          npx --yes netlify-cli@26 deploy --site fa5d39a0-bef9-4ff1-9c28-57d585d741d7 --dir build/gravity-release-review --functions functions --context deploy-preview --alias gravity-release-review --message "GRAVITY RELEASE REVIEW ONLY / NOINDEX / NOT PRODUCTION" --json > /tmp/gravity-release-review.json
          node -e 'const v=require("/tmp/gravity-release-review.json");console.log(JSON.stringify({url:v.deploy_url||v.url,id:v.deploy_id},null,2))'
      - name: Validate public review alias without publishing
        shell: bash
        run: |
          set -euo pipefail
          base="https://gravity-release-review--gravity-leadership-system.netlify.app"
          for page in / /books /register /apps/sop-foundry/employee-app /apps/sop-foundry/staff-posters; do
            headers="$(mktemp)"
            body="$(mktemp)"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --dump-header "$headers" --output "$body" "$base$page"
            grep -qi '^x-robots-tag: noindex, nofollow' "$headers" || { echo "MISSING noindex header: $page"; exit 1; }
            grep -qi '<html' "$body" || { echo "Invalid HTML: $page"; exit 1; }
            echo "Review alias HTTP/noindex PASS: $page"
            rm -f "$headers" "$body"
          done
          # Netlify functions may return a transient 502 immediately after a new deploy.
          # Do not mask a sustained outage: compare the existing migration alias and retry.
          for alias in "https://gravity-migration--gravity-leadership-system.netlify.app" "$base"; do
            health_file="$(mktemp)"
            curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 --output "$health_file" "$alias/foundry-hosted/health"
            HEALTH_FILE="$health_file" node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.env.HEALTH_FILE,"utf8"));if(x.ok!==true)process.exit(1)'
            echo "Hosted backend health PASS: $alias"
            rm -f "$health_file"
          done
      - name: Retain review-only build
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-production-candidate-UNPUBLISHED
          path: build/gravity-production-candidate/
          retention-days: 14
