name: Gravity production candidate — offline QA only
on:
  push:
    branches:
      - 'feature/gravity-migration-phase1-*'
    paths:
      - 'scripts/prepare-gravity-production-candidate.cjs'
      - '.github/workflows/gravity-production-candidate-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare offline candidate
        run: node scripts/prepare-gravity-production-candidate.cjs
      - name: Verify no staging banners or staging indexing blocks
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='build/gravity-production-candidate';
          const path=require('path');
          let pages=0, brokenLinks=[];
          function scan(dir){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
            const filename=path.join(dir,entry.name);
            if(entry.isDirectory()){scan(filename);continue;}
            if(!filename.endsWith('.html'))continue;
            pages++;
            const html=fs.readFileSync(filename,'utf8');
            if(html.includes('gravity-migration-preview-notice')||html.includes('GRAVITY MIGRATION PREVIEW — NOT LIVE FOR CUSTOMERS')||/name=["']robots["'][^>]*noindex,nofollow/i.test(html))throw Error('Staging marker on '+filename);
            for(const match of html.matchAll(/(?:href|src)=["'](\/assets\/[^"'?#]+\.(?:pdf|zip|docx|xlsx|js|css))["'?#]/gi)){
              const target=path.join(p,decodeURIComponent(match[1]).slice(1));
              if(!fs.existsSync(target))brokenLinks.push(filename+': '+match[1]);
            }
          }}
          scan(p);
          if(pages<100)throw Error('Incomplete HTML candidate: '+pages);
          if(brokenLinks.length)throw Error('Missing local linked assets: '+brokenLinks.slice(0,15).join('; '));
          if(!fs.readFileSync(p+'/robots.txt','utf8').includes('Allow: /'))throw Error('Indexing still blocked');
          console.log('OFFLINE CANDIDATE PASS — NOT DEPLOYED');
          NODE
      - name: Prepare noindex review alias from production candidate
        run: |
          cp -a build/gravity-production-candidate build/gravity-release-review
          node - <<'NODE'
          const fs=require('fs'),path='build/gravity-release-review/_headers';
          fs.writeFileSync('build/gravity-release-review/robots.txt','User-agent: *'+String.fromCharCode(10)+'Disallow: /'+String.fromCharCode(10));
          let headers=fs.readFileSync(path,'utf8');
          const lines=headers.split(String.fromCharCode(10));
          const i=lines.findIndex(line=>line.trim()==='/*');
          if(i<0)throw Error('Missing wildcard headers stanza');
          lines.splice(i+1,0,'  X-Robots-Tag: noindex, nofollow');
          fs.writeFileSync(path,lines.join(String.fromCharCode(10)));
          NODE
      - name: Deploy unpublished review alias (never production)
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          ALT_NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          ALT_NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          token="${NETLIFY_AUTH_TOKEN:-${ALT_NETLIFY_TOKEN:-${ALT_NETLIFY_ACCESS_TOKEN:-}}}"
          if [ -z "$token" ]; then
            echo 'Review alias not deployed: Netlify deployment token unavailable.'
            exit 0
          fi
          export NETLIFY_AUTH_TOKEN="$token"
          npx --yes netlify-cli@26 deploy --site fa5d39a0-bef9-4ff1-9c28-57d585d741d7 --dir build/gravity-release-review --functions functions --context deploy-preview --alias gravity-release-review --message "GRAVITY RELEASE REVIEW ONLY / NOINDEX / NOT PRODUCTION" --json > /tmp/gravity-release-review.json
          node -e 'const v=require("/tmp/gravity-release-review.json");console.log(JSON.stringify({url:v.deploy_url||v.url,id:v.deploy_id},null,2))'
      - name: Retain review-only build
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-production-candidate-UNPUBLISHED
          path: build/gravity-production-candidate/
          retention-days: 14
