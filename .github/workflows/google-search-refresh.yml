name: Google search refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-search-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh current search-facing facts
        run: node scripts/google-search-refresh.cjs
      - name: Rebuild sitemap
        run: node scripts/update-sitemap.cjs
      - name: Refresh source manifest
        run: npm run manifest
      - name: Verify source
        run: npm run build
      - name: Commit verified SEO refresh
        run: |
          if git diff --quiet; then
            echo 'Search-facing source already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site source-manifest.json
          git commit -m 'Refresh Google crawl signals and current Gravity search facts'
          git push
