name: Gravity data safety, automatic recovery and cross-device verification (NO DEPLOY)
on:
  push:
    branches: [feature/gravity-migration-phase1-2026-10-22]
    paths:
      - .github/workflows/gravity-customer-data-protection-2026-10-30.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  data-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated live browser runner
        run: |
          node --check scripts/qa-gravity-customer-data-protection.mjs
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Verify production browser storage, backup restoration, and loss cases
        run: node scripts/qa-gravity-customer-data-protection.mjs
      - name: Preserve test results without modifying customer data or deploying
        if: always()
        run: |
          set -euo pipefail
          test -s docs/audits/gravity-customer-data-protection-2026-10-30.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/gravity-customer-data-protection-2026-10-30.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(gravity): record observed production data protection gaps [skip ci]"
          git fetch --no-tags origin feature/gravity-migration-phase1-2026-10-22
          git rebase origin/feature/gravity-migration-phase1-2026-10-22
          git push origin HEAD:feature/gravity-migration-phase1-2026-10-22
