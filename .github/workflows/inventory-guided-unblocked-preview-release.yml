name: Publish Inventory Guided Click-Fix Windows Preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventory-guided-unblocked-preview-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-tested-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: '39363132837'
      EXPECTED_SHA: 'b4f8c95ae71155c53123c136384efe6723d4f400'
      RELEASE_TAG: 'gravity-inventory-guided-clickfix-2026-10-19'
    steps:
      - uses: actions/checkout@v4
      - name: Gate release on completed Windows customer workflow and installed-app verification
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '[.status,.conclusion,.head_sha] | join(":")')"
          test "$state" = "completed:success:$EXPECTED_SHA" || { echo "::error::Windows acceptance is not fully successful: $state"; exit 1; }
          echo 'The complete Windows smoke, first-run guide and silent-install tests passed.'
      - name: Retrieve independently tested Windows build and validate archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          gh run download "$RUN_ID" -n Gravity-Inventory-Center-Windows-Candidate -D stage
          installer="$(find stage -maxdepth 1 -name '*.exe' -type f | head -1)"
          archive="$(find stage -maxdepth 1 -name '*.zip' -type f | head -1)"
          test -n "$installer" && test -n "$archive"
          test "$(find stage -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find stage -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          mv "$installer" stage/Gravity_Inventory_Center_GUIDED_CLICK_FIX_2026-10-19_x64.exe
          mv "$archive" stage/Gravity_Inventory_Center_GUIDED_CLICK_FIX_2026-10-19_x64.zip
          unzip -tqq stage/*.zip
          (cd stage && sha256sum *.exe *.zip > SHA256SUMS.txt)
          test "$(wc -l < stage/SHA256SUMS.txt)" -eq 2
      - name: Explain fixes and limitations to customers
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          # Gravity Inventory Center Windows — First Inventory walkthrough click fix

          **Fixed:** On a new installation, the automatic Restaurant Profile modal blocked mouse clicks on the 29-step First Inventory walkthrough. The tour now opens before the profile form. Step 2 has an **Open Restaurant Profile** button; after the user saves or cancels that form, the tour automatically resumes. The walkthrough also supports Back, Next Step, Show This Screen and Save My Place.

          This release was built from source b4f8c95ae71155c53123c136384efe6723d4f400 and checked through Windows Actions run 39363132837, including a first-launch UI hit test, on-demand profile step, navigation/resumption, stock receiving, movements, count posting, backup/restore, app restart, generated PDF, silent installer and installed-app operation.

          **Install:** This Windows x64 preview is unsigned. The .exe is an installer; the .zip is the portable build. Keep your existing installation and save independent backups first. Existing customer data is not automatically migrated between app versions. Test with sample inventory until you have verified data, physical printer and barcode equipment.

          **Manual:** Full current PDF, Word, and online manuals are linked beside downloads at https://thomasmonroebooks.com/gravity-inventory-center and https://thomasmonroebooks.com/windows-programs.
          NOTES
      - name: Publish separate preview release, preserving old downloads
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; no overwrite"
            exit 1
          fi
          gh release create "$RELEASE_TAG" stage/*.exe stage/*.zip stage/SHA256SUMS.txt \
            --target "$EXPECTED_SHA" --draft --prerelease \
            --title 'Gravity Inventory Center — Guided Walkthrough Click Fix' \
            --notes-file RELEASE_NOTES.md
          count="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
          test "$count" -eq 3 || { echo "::error::Missing release assets; left draft"; exit 1; }
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          echo "Verified Windows Inventory Center click-fix preview is public."
