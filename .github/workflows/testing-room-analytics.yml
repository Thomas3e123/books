name: Testing Room analytics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/testing-room-analytics.yml'
permissions:
  contents: write
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add privacy-safe Testing Room GA4 events
        run: node scripts/testing-room-analytics.cjs
      - name: Rebuild sitemap
        run: node scripts/update-sitemap.cjs
      - name: Refresh controlled manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit verified analytics release
        run: |
          if git diff --quiet; then
            echo 'Testing Room analytics already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site source-manifest.json
          git commit -m 'Track Testing Room conversions in GA4'
          git push
