name: Gravity SOP Foundry multi-tab conflict proof (audit-only)
on:
  push:
    branches:
      - audit/foundry-multitab-conflict-2026-11-09
    paths:
      - '.github/workflows/gravity-foundry-multitab-2026-11-09.yml'
      - 'tests/browser/foundry-multitab-conflict.spec.cjs'
permissions:
  contents: read
jobs:
  isolated-conflict:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Prove two browser tabs do not silently overwrite SOP drafts
        run: npx playwright test tests/browser/foundry-multitab-conflict.spec.cjs --project=desktop-chromium --reporter=line
