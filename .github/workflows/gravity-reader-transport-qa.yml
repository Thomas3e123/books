name: Gravity Reader — mobile transport and wake lock QA
on:
  push:
    branches:
      - 'feature/gravity-migration-phase1-*'
    paths:
      - 'scripts/test-gravity-reader-transport-browser.cjs'
      - 'scripts/test-gravity-reader-continuity-browser.cjs'
      - '.github/workflows/gravity-reader-transport-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-mobile-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          which google-chrome
      - name: Verify playback controls and screen-wake lifecycle using synthetic audio
        run: |
          node scripts/test-gravity-reader-transport-browser.cjs
          node scripts/test-gravity-reader-continuity-browser.cjs
