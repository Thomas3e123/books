name: Gravity website migration — isolated, noindex preview
on:
  push:
    branches:
      - 'feature/gravity-migration-phase1-*'
    paths:
      - '.github/workflows/gravity-site-migration.yml'
      - 'scripts/prepare-gravity-preview.cjs'
      - 'scripts/verify-gravity-preview.cjs'
      - 'docs/gravity-migration-2026-10-22.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-static-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      ALT_NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      ALT_NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
      GRAVITY_NETLIFY_SITE_ID: fa5d39a0-bef9-4ff1-9c28-57d585d741d7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare brand-separated preview (never main, no production domain)
        run: |
          npm ci
          node scripts/prepare-gravity-preview.cjs
          node scripts/update-manifest.cjs
          npm run build
          node scripts/verify-gravity-preview.cjs
      - name: Verify Employee Connection contract using disposable in-memory data
        run: node scripts/test-gravity-employee-connection.cjs
      - name: Preserve reproducible preview source on migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site source-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(migration): stage Gravity preview source and integrity manifest [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Verify prerecorded Cedar clips in deploy package
        shell: bash
        run: |
          set -euo pipefail
          for i in 01 02 03 04 05 06 07 08; do
            file="site/assets/audio/gravity-ack/cedar-${i}.mp3"
            test -s "$file" || { echo "Missing Cedar clip: $file"; exit 1; }
          done
          grep -q 'playImmediateAck()' site/assets/js/gravity-guide-ai.js
          grep -q 'cedar-prereply' site/index.html
          echo 'All prerecorded Cedar clips and voice frontend present'
      - name: Deploy a DRAFT preview to the NEW Gravity Netlify project only
        shell: bash
        run: |
          set -euo pipefail
          token="${NETLIFY_AUTH_TOKEN:-${ALT_NETLIFY_TOKEN:-${ALT_NETLIFY_ACCESS_TOKEN:-}}}"
          if [ -z "$token" ]; then
            echo 'PREVIEW DEPLOY NOT PERFORMED: GitHub repository has no usable Netlify deploy token secret.'
            echo 'The approved source is available on the migration branch. Connect the new Netlify project to that branch in Netlify or authorize a new-site deploy token.'
            exit 0
          fi
          export NETLIFY_AUTH_TOKEN="$token"
          npx --yes netlify-cli@26 deploy --site "$GRAVITY_NETLIFY_SITE_ID" --dir site --functions functions --context deploy-preview --alias gravity-migration --message "INTERNAL GRAVITY MIGRATION PREVIEW - not customer ready" --json > /tmp/gravity-preview-deploy.json
          node -e 'const o=require("/tmp/gravity-preview-deploy.json"); console.log(JSON.stringify({site_id:o.site_id,deploy_id:o.deploy_id,url:o.deploy_url||o.url},null,2))'
      - name: Verify live migration audio and script over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base="https://gravity-migration--gravity-leadership-system.netlify.app"
          for i in 01 02 03 04 05 06 07 08; do
            url="$base/assets/audio/gravity-ack/cedar-${i}.mp3"
            curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --retry-all-errors --output "/tmp/cedar-${i}.mp3" "$url"
            test "$(wc -c < "/tmp/cedar-${i}.mp3")" -gt 1000 || { echo "Cedar clip too small: $url"; exit 1; }
            file --mime-type "/tmp/cedar-${i}.mp3" | grep -q 'audio/' || { echo "Not recognized as audio: $url"; exit 1; }
            echo "HTTP audio PASS: cedar-${i}.mp3"
          done
          curl --fail --silent --show-error --location "$base/assets/js/gravity-guide-ai.js?v=20261025-cedar-prereply-1" | grep -q 'playImmediateAck()'
          for page in / /books /about /start-here; do
            curl --fail --silent --show-error --location "$base$page" | grep -q '20261025-cedar-prereply-3' || { echo "Stale Ask Gravity on $page"; exit 1; }
            echo "Current Cedar frontend PASS: $page"
          done
          echo 'LIVE Gravity prereply assets PASS'
      - name: Live Employee Connection health and public mobile smoke checks
        shell: bash
        run: |
          set -euo pipefail
          base="https://gravity-migration--gravity-leadership-system.netlify.app"
          health="$(curl --fail --silent --show-error --location "$base/foundry-hosted/health")"
          HEALTH_JSON="$health" node -e 'const x=JSON.parse(process.env.HEALTH_JSON);if(x.ok!==true||!String(x.service).includes("Foundry"))process.exit(1);console.log("Live hosted employee health PASS")'
          for page in / /books /register /testing-room /gravity-sop-foundry /gravity-shift-lab /gravity-inventory-center /gravity-work-study-lab /e; do
            output="$(mktemp)"
            curl --fail --silent --show-error --location "$base$page" -o "$output"
            node -e 'const fs=require("fs"),s=fs.readFileSync(process.argv[1],"utf8"),metas=s.match(/<meta[^>]*>/gi)||[];if(!metas.some(m=>m.includes("viewport")&&m.includes("width=device-width")))process.exit(1)' "$output"
            echo "Responsive viewport markup PASS: $page"
            rm -f "$output"
          done
          # Negative lookup checks that the hosted router and database path respond, without creating records.
          code="ZZZZZZ"
          status="$(curl --silent --show-error --output /tmp/gls-missing-workspace.json --write-out '%{http_code}' "$base/foundry-hosted/workspace/$code")"
          test "$status" = 404 || { echo "Expected missing workspace HTTP 404; got $status"; exit 1; }
          echo "Hosted workspace lookup negative-path PASS"
      - name: Upload static QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-migration-phase1-static-evidence
          path: |
            docs/gravity-migration-2026-10-22.md
            source-manifest.json
          retention-days: 30
