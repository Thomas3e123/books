name: Work Study expert triage v61

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/js/gravity-work-study-expert-triage-v61.js'
      - 'scripts/work-study-expert-triage-v61-suite.cjs'
      - 'scripts/work-study-expert-triage-v61-integrate.cjs'
      - '.github/workflows/work-study-expert-triage-v61.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate expert triage
        run: node scripts/work-study-expert-triage-v61-integrate.cjs
      - name: Syntax and triage regression
        run: |
          node --check site/assets/js/gravity-work-study-expert-triage-v61.js
          node scripts/work-study-expert-triage-v61-suite.cjs
      - name: Install expert stack
        run: node scripts/upgrade-work-study-lab-v2.cjs
      - name: Run all Work Study regressions
        run: |
          set -e
          for f in scripts/work-study-*-suite.cjs; do node "$f"; done
      - name: Refresh source manifest
        run: npm run manifest
      - name: Verify controlled build
        run: npm run build
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/upgrade-work-study-lab-v2.cjs site/gravity-work-study-lab.html source-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate Work Study expert triage v61"
          git pull --rebase origin main
          git push origin HEAD:main
