name: Work Study Windows beta site link
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-work-study-windows-beta-link.cjs'
      - '.github/workflows/work-study-windows-beta-link.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add Windows beta download card
        run: node scripts/add-work-study-windows-beta-link.cjs
      - name: Refresh controlled source manifest
        run: npm run manifest
      - name: Verify controlled site build
        run: npm run build
      - name: Commit updated Work Study page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/gravity-work-study-lab.html source-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Work Study Windows beta download card"
          git pull --rebase origin main
          git push origin HEAD:main
