name: Work Study Lab v2 upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade-work-study-lab-v2.cjs'
      - 'site/assets/js/gravity-work-study-v2.js'
      - 'site/assets/js/gravity-work-study-guided-v3.js'
      - 'site/assets/css/gravity-work-study-v2.css'
      - '.github/workflows/work-study-lab-v2-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check Work Study JavaScript syntax
        run: |
          node --check site/assets/js/gravity-work-study-v2.js
          node --check site/assets/js/gravity-work-study-guided-v3.js
      - name: Apply Work Study shell and Guided Development layer
        run: node scripts/upgrade-work-study-lab-v2.cjs
      - name: Smoke check generated page
        run: |
          grep -q 'id="ws2-app"' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-v2.css' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-v2.js' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-guided-v3.js' site/gravity-work-study-lab.html
          if grep -q 'gravity-work-study.js?v=' site/gravity-work-study-lab.html; then
            echo 'Legacy Work Study Lab JavaScript is still referenced.'
            exit 1
          fi
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit generated page and manifest
        run: |
          if git diff --quiet -- site/gravity-work-study-lab.html source-manifest.json; then
            echo "Work Study Lab source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/gravity-work-study-lab.html source-manifest.json
          git commit -m "Install Guided Work Study development layer"
          git pull --rebase origin main
          git push origin HEAD:main
