name: Work Study Lab v2 upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade-work-study-lab-v2.cjs'
      - 'scripts/patch-work-study-guided-method.cjs'
      - 'scripts/patch-work-study-guided-observer.cjs'
      - 'scripts/patch-work-study-recommender-v2.cjs'
      - 'scripts/patch-work-study-results-v6.cjs'
      - 'scripts/patch-work-study-beforeafter-v6.cjs'
      - 'scripts/patch-work-study-expert-reasoning-v7.cjs'
      - 'scripts/patch-work-study-adversarial-v8.cjs'
      - 'scripts/patch-work-study-systems-v10.cjs'
      - 'scripts/patch-work-study-sequence-v11.cjs'
      - 'scripts/work-study-scenario-suite.cjs'
      - 'scripts/work-study-conclusion-suite.cjs'
      - 'scripts/work-study-expert-reasoning-suite.cjs'
      - 'scripts/work-study-adversarial-suite.cjs'
      - 'scripts/work-study-systems-expert-suite.cjs'
      - 'scripts/work-study-sequence-expert-suite.cjs'
      - 'scripts/work-study-guided-interview-suite.cjs'
      - 'scripts/patch-testing-rewards.cjs'
      - 'scripts/patch-testing-founder-shortcut.cjs'
      - 'site/testing-room.html'
      - 'site/assets/js/gravity-work-study-v2.js'
      - 'site/assets/js/gravity-work-study-guided-v3.js'
      - 'site/assets/js/gravity-work-study-guided-welcome-v9.js'
      - 'site/assets/js/gravity-work-study-guided-interview-v13.js'
      - 'site/assets/js/gravity-work-study-expert-v5.js'
      - 'site/assets/js/gravity-work-study-expert-reasoning-v7.js'
      - 'site/assets/js/gravity-work-study-systems-expert-v10.js'
      - 'site/assets/js/gravity-work-study-sequence-expert-v11.js'
      - 'site/assets/css/gravity-work-study-v2.css'
      - '.github/workflows/work-study-lab-v2-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Align Guided method selection
        run: node scripts/patch-work-study-guided-method.cjs
      - name: Strengthen restaurant method classification
        run: node scripts/patch-work-study-recommender-v2.cjs
      - name: Guard Guided redraw behavior
        run: node scripts/patch-work-study-guided-observer.cjs
      - name: Strengthen Results Review evidence standards
        run: node scripts/patch-work-study-results-v6.cjs
      - name: Add structured Before After evidence
        run: node scripts/patch-work-study-beforeafter-v6.cjs
      - name: Integrate method-specific expert reasoning
        run: node scripts/patch-work-study-expert-reasoning-v7.cjs
      - name: Add adversarial conflict reasoning
        run: node scripts/patch-work-study-adversarial-v8.cjs
      - name: Integrate systems-context expert reasoning
        run: node scripts/patch-work-study-systems-v10.cjs
      - name: Integrate constraint-sequence expert reasoning
        run: node scripts/patch-work-study-sequence-v11.cjs
      - name: Make tester rewards definitive
        run: node scripts/patch-testing-rewards.cjs
      - name: Install hidden Founder shortcut
        run: node scripts/patch-testing-founder-shortcut.cjs
      - name: Check Work Study JavaScript syntax
        run: |
          node --check site/assets/js/gravity-work-study-v2.js
          node --check site/assets/js/gravity-work-study-guided-v3.js
          node --check site/assets/js/gravity-work-study-guided-welcome-v9.js
          node --check site/assets/js/gravity-work-study-guided-interview-v13.js
          node --check site/assets/js/gravity-work-study-expert-v5.js
          node --check site/assets/js/gravity-work-study-expert-reasoning-v7.js
          node --check site/assets/js/gravity-work-study-systems-expert-v10.js
          node --check site/assets/js/gravity-work-study-sequence-expert-v11.js
      - name: Run restaurant scenario regression suite
        run: node scripts/work-study-scenario-suite.cjs
      - name: Run conclusion evidence regression suite
        run: node scripts/work-study-conclusion-suite.cjs
      - name: Run expert reasoning regression suite
        run: node scripts/work-study-expert-reasoning-suite.cjs
      - name: Run adversarial expert regression suite
        run: node scripts/work-study-adversarial-suite.cjs
      - name: Run systems expert regression suite
        run: node scripts/work-study-systems-expert-suite.cjs
      - name: Run constraint-sequence expert regression suite
        run: node scripts/work-study-sequence-expert-suite.cjs
      - name: Run Guided interview regression suite
        run: node scripts/work-study-guided-interview-suite.cjs
      - name: Apply Work Study shell and Guided Development layer
        run: node scripts/upgrade-work-study-lab-v2.cjs
      - name: Smoke check generated page and tester reward promise
        run: |
          grep -q 'id="ws2-app"' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-v2.css?v=20261016-rich-guided' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-v2.js' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-guided-v3.js?v=20261016-fully-guided-v4' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-guided-welcome-v9.js?v=20261016-guided-takeover-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-guided-interview-v13.js?v=20261016-guided-interview-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-expert-v5.js?v=20261016-restaurant-expert-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-expert-reasoning-v7.js?v=20261016-expert-reasoning-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-systems-expert-v10.js?v=20261016-systems-expert-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-sequence-expert-v11.js?v=20261016-sequence-expert-v1' site/gravity-work-study-lab.html
          grep -q "Hello. I’m Gravity. I’ll take you through this." site/assets/js/gravity-work-study-guided-interview-v13.js
          grep -q "Tell Gravity" site/assets/js/gravity-work-study-guided-interview-v13.js
          grep -q "Show me the facts" site/assets/js/gravity-work-study-guided-interview-v13.js
          grep -q "Gravity Systems Expert Check" site/assets/js/gravity-work-study-systems-expert-v10.js
          grep -q "Gravity Constraint Sequence Check" site/assets/js/gravity-work-study-sequence-expert-v11.js
          grep -q "systemsAssessment" site/assets/js/gravity-work-study-v2.js
          grep -q "sequenceAssessment" site/assets/js/gravity-work-study-v2.js
          grep -q "gravity-founder-shortcut" site/testing-room.html
          grep -q "location.href='/testing-room-manager'" site/testing-room.html
          grep -q "you receive the final version of that program at no charge" site/testing-room.html
          grep -q "10 people whose testing contributes the most receive lifetime access" site/testing-room.html
          if grep -q 'gravity-work-study.js?v=' site/gravity-work-study-lab.html; then exit 1; fi
          if grep -Eq 'materially help improve a Gravity Windows beta[^<]*\bmay\b|10 people whose testing contributes the most[^<]*\bmay\b' site/testing-room.html; then exit 1; fi
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit generated Work Study and Testing Room source
        run: |
          if git diff --quiet -- site/gravity-work-study-lab.html site/testing-room.html site/assets/js/gravity-work-study-v2.js site/assets/js/gravity-work-study-guided-v3.js site/assets/js/gravity-work-study-guided-welcome-v9.js site/assets/js/gravity-work-study-guided-interview-v13.js site/assets/js/gravity-work-study-expert-v5.js site/assets/js/gravity-work-study-expert-reasoning-v7.js site/assets/js/gravity-work-study-systems-expert-v10.js site/assets/js/gravity-work-study-sequence-expert-v11.js source-manifest.json; then
            echo "Work Study Lab and Testing Room source are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/gravity-work-study-lab.html site/testing-room.html site/assets/js/gravity-work-study-v2.js site/assets/js/gravity-work-study-guided-v3.js site/assets/js/gravity-work-study-guided-welcome-v9.js site/assets/js/gravity-work-study-guided-interview-v13.js site/assets/js/gravity-work-study-expert-v5.js site/assets/js/gravity-work-study-expert-reasoning-v7.js site/assets/js/gravity-work-study-systems-expert-v10.js site/assets/js/gravity-work-study-sequence-expert-v11.js source-manifest.json
          git commit -m "Make Guided Work Study a Gravity-led interview"
          git pull --rebase origin main
          git push origin HEAD:main
