name: Work Study Windows v56 package bridge

on:
  push:
    branches: [main]
    paths:
      - 'scripts/work-study-windows-v56-package-bridge.cjs'
      - '.github/workflows/work-study-windows-v56-package-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install v56 package bridge
        run: node scripts/work-study-windows-v56-package-bridge.cjs
      - name: Verify Windows package bridge
        run: |
          node --check windows/gravity-work-study-lab/renderer.js
          grep -q "packageType==='gravity-work-study-evidence-package'" windows/gravity-work-study-lab/renderer.js
          grep -q "gravityDesktop.exportStudy(portableExport(current))" windows/gravity-work-study-lab/renderer.js
          grep -q "sidecars:imported.sidecars||{}" windows/gravity-work-study-lab/renderer.js
      - name: Refresh source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit corrected Windows source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/gravity-work-study-lab/renderer.js source-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bridge complete Work Study evidence packages into Windows"
          git pull --rebase origin main
          git push origin HEAD:main
