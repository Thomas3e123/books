name: Gravity page-search relevance repair QA
on:
  push:
    branches:
      - audit/search-accuracy-repair-2026-11-09
    paths:
      - .github/workflows/gravity-search-relevance-qa-2026-11-09.yml
      - tests/browser/search-quality-faq.spec.cjs
      - site/assets/js/page-search.js
      - site/help-center.html
      - source-manifest.json
permissions:
  contents: read
jobs:
  search-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check site/assets/js/page-search.js
      - name: Verify source hashes and compile the website
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Chromium for desktop/mobile verification
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify FAQ printing, relevant result ordering and labels
        run: npx playwright test tests/browser/search-quality-faq.spec.cjs --reporter=line
