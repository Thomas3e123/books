name: Work Study expert synthesis

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/js/gravity-work-study-synthesis-v24.js'
      - 'scripts/work-study-synthesis-suite.cjs'
      - 'scripts/upgrade-work-study-lab-v2.cjs'
      - '.github/workflows/work-study-synthesis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesis-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check synthesis syntax
        run: node --check site/assets/js/gravity-work-study-synthesis-v24.js
      - name: Run synthesis regression suite
        run: node scripts/work-study-synthesis-suite.cjs
      - name: Install synthesis in Work Study page
        run: node scripts/upgrade-work-study-lab-v2.cjs
      - name: Verify generated Work Study page
        run: |
          grep -q 'gravity-work-study-synthesis-v24.js?v=20261016-expert-synthesis-v1' site/gravity-work-study-lab.html
          grep -q 'consolidated expert synthesis' site/gravity-work-study-lab.html
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit generated Work Study page
        run: |
          if git diff --quiet -- site/gravity-work-study-lab.html source-manifest.json; then
            echo "Work Study expert synthesis source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/gravity-work-study-lab.html source-manifest.json
          git commit -m "Install Work Study expert synthesis"
          git pull --rebase origin main
          git push origin HEAD:main
