name: Gravity public site — isolated production publish and brand verification
on:
  push:
    branches: ['feature/gravity-migration-phase1-2026-10-22']
    paths: ['.github/workflows/gravity-public-launch-2026-10-27.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gravity-public:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_ID: fa5d39a0-bef9-4ff1-9c28-57d585d741d7
      TOKEN_A: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      TOKEN_B: ${{ secrets.NETLIFY_TOKEN }}
      TOKEN_C: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify source and produce isolated PUBLIC package
        run: |
          set -euo pipefail
          npm ci
          npm run manifest
          npm run build
          node scripts/prepare-gravity-public-launch.cjs
          node scripts/update-gravity-footer.cjs
          # Editorial audience correction: Report is for employees, supervisors, managers and owners alike.
          node scripts/test-gravity-report.mjs
          node --check site/assets/js/gravity-report-reading.js
          node --check functions/gravity-report/index.mjs
          node scripts/test-gravity-report-reading.mjs
          node --check site/assets/js/book-reader.js
          node scripts/test-gravity-report-listening.mjs
          node scripts/test-gravity-report-guest-voices.mjs
          grep -Fq 'Read the full article on Gravity:' site/assets/js/gravity-report-reading.js
          grep -Fq 'https://www.facebook.com/sharer/sharer.php?u=' functions/gravity-report/index.mjs
          grep -Fq 'id="report-search"' site/gravity-report.html
          grep -Fq 'id="report-feature"' site/gravity-report.html
          grep -Fq 'id="report-series"' site/gravity-report.html
          grep -Fq 'id="report-field-sheets"' site/gravity-report.html
          grep -Fq 'gravity-report-reading.css' site/gravity-report.html
          grep -Fq 'Publisher and Editor of The Gravity Report' site/index.html
          grep -Fq 'Restaurant Leadership, Systems &amp; Operations' site/index.html
          grep -Fq 'Publisher and Editor of The Gravity Report' site/gravity-report.html
          grep -q 'gravityleadershipsystem.com' site/index.html
          ! grep -q '^Disallow: /$' site/robots.txt
          # The packaging script enforces absence of the root-wide noindex rule.
          grep -Fq 'id="gravity-field-test-guide"' site/testing-room.html
          grep -Fq 'Protect private information' site/testing-room.html
          test -s site/assets/js/gravity-shift-lab.js
          test -s site/apps/inventory-center/assets/js/inventory-center.js
      - name: Deploy strictly to NEW Gravity Netlify production site
        run: |
          set -euo pipefail
          token="${TOKEN_A:-${TOKEN_B:-${TOKEN_C:-}}}"
          if [ -z "$token" ]; then echo 'FAILED: No Netlify deployment token'; exit 1; fi
          export NETLIFY_AUTH_TOKEN="$token"
          npx --yes netlify-cli@26 deploy --prod --no-build --site "$SITE_ID" --dir site --functions functions --message "GRAVITY PUBLIC story-first Report magazine front with operator library / TMB untouched" --json > /tmp/gls-production-deploy.json
          node -e 'const d=require("/tmp/gls-production-deploy.json"); console.log(JSON.stringify({site_id:d.site_id,deploy_id:d.deploy_id,deploy_url:d.deploy_url,url:d.url},null,2));if(d.site_id!=="fa5d39a0-bef9-4ff1-9c28-57d585d741d7")process.exit(1)'
      - name: Confirm public indexing and protected asset robots headers
        run: |
          set -euo pipefail
          base=https://gravityleadershipsystem.com
          for p in / /about /start-here /gravity-report; do
            hdr=$(mktemp); html=$(mktemp)
            curl -fsSL --retry 4 --retry-delay 3 --max-time 25 -D "$hdr" "$base$p" -o "$html"
            if grep -iq '^x-robots-tag:.*noindex' "$hdr";then echo "FAILED public header: $p"; exit 1;fi
            if grep -iqE '<meta[^>]+content=["\x27]noindex' "$html";then echo "FAILED public meta: $p";exit 1;fi
            if [[ "$p" == "/" || "$p" == "/about" || "$p" == "/gravity-report" ]]; then
              grep -Fq 'Publisher and Editor of The Gravity Report' "$html" || { echo "Missing editorial footer on $p"; exit 1; }
              grep -Fq 'Restaurant Leadership, Systems &amp; Operations' "$html" || { echo "Missing updated branding on $p"; exit 1; }
            fi
            echo "PUBLIC INDEX AND FOOTER OK $p"
            rm -f "$hdr" "$html"
          done
          curl -fsSL "$base/testing-room" -o /tmp/gravity-customer-testing.html
          grep -Fq 'id="gravity-field-test-guide"' /tmp/gravity-customer-testing.html
          grep -Fq 'Protect private information' /tmp/gravity-customer-testing.html
          echo 'CUSTOMER_TESTING_GUIDE_LIVE_PASS'
          # Verify article-reader experience and issue catalog on the real public host.
          curl -fsSL "$base/gravity-report" -o /tmp/gravity-report-catalog-live.html
          grep -Fq 'id="report-search"' /tmp/gravity-report-catalog-live.html
          grep -Fq 'data-report-upcoming' /tmp/gravity-report-catalog-live.html
          grep -Fq 'gravity-report-reading.css' /tmp/gravity-report-catalog-live.html
          curl -fsSL "$base/gravity-report/why-do-my-restaurant-managers-keep-making-excuses" -o /tmp/gravity-report-article-live.html
          grep -Fq 'class="report-body"' /tmp/gravity-report-article-live.html
          grep -Fq 'data-report-font="increase"' /tmp/gravity-report-article-live.html
          grep -Fq 'class="report-toc"' /tmp/gravity-report-article-live.html
          grep -Fq 'Publisher and Editor of The Gravity Report' /tmp/gravity-report-article-live.html
          curl -fsSL "$base/assets/js/gravity-report-reading.js?v=20261029-magazine-v1" -o /tmp/gravity-report-reader-js
          test -s /tmp/gravity-report-reader-js
          curl -fsSL "$base/assets/css/gravity-report-reading.css?v=20261029-magazine-v1" -o /tmp/gravity-report-reader-css
          test -s /tmp/gravity-report-reader-css
          grep -Fq 'data-report-share="post"' /tmp/gravity-report-article-live.html
          grep -Fq 'data-report-share="link"' /tmp/gravity-report-article-live.html
          grep -Fq 'data-report-url="https://gravityleadershipsystem.com/gravity-report/' /tmp/gravity-report-article-live.html
          grep -Fq '<meta property="og:image"' /tmp/gravity-report-article-live.html
          grep -Fq 'Read the full article on Gravity:' /tmp/gravity-report-reader-js
          grep -Fq "url='https://gravityleadershipsystem.com'+href" /tmp/gravity-report-reader-js
          # Check Report-to-Reader audio, reading controls, and share links on the production host.
          curl -fsSL "$base/book-reader" -o /tmp/gravity-reader-live.html
          grep -Fq 'Gravity Reader' /tmp/gravity-reader-live.html
          grep -Fq 'id="reader-available-articles"' /tmp/gravity-reader-live.html
          curl -fsSL "$base/assets/js/book-reader.js?v=20261028-gravity-report-audio-v1" -o /tmp/gravity-book-reader-js
          grep -Fq "kind:'report'" /tmp/gravity-book-reader-js
          curl -fsSL "$base/gravity-report/reader-text?slug=why-do-my-restaurant-managers-keep-making-excuses" -o /tmp/gravity-article-narration.txt
          grep -Fq 'By Thomas Butler' /tmp/gravity-article-narration.txt
          grep -Fq 'gravityleadershipsystem.com/gravity-report' /tmp/gravity-article-narration.txt
          grep -Fq 'Listen in Gravity Reader' /tmp/gravity-report-article-live.html
          grep -Fq 'id="report-reading-theme"' /tmp/gravity-report-article-live.html
          grep -Fq 'id="report-reading-font"' /tmp/gravity-report-article-live.html
          grep -Fq 'https://www.linkedin.com/sharing/share-offsite/' /tmp/gravity-report-article-live.html
          grep -Fq 'https://x.com/intent/tweet' /tmp/gravity-report-article-live.html
          grep -Fq 'https://api.whatsapp.com/send' /tmp/gravity-report-article-live.html
          grep -Fq 'https://bsky.app/intent/compose' /tmp/gravity-report-article-live.html
          curl -fsSL "$base/gravity-report-guests" -o /tmp/gravity-guest-voices.html
          grep -Fq 'Guest Voices: Real Experience Worth Sharing' /tmp/gravity-guest-voices.html
          grep -Fq 'mailto:thomas.butler@gravityleadershipsystem.com' /tmp/gravity-guest-voices.html
          grep -Fq 'does not guarantee acceptance or publication' /tmp/gravity-guest-voices.html
          grep -Fq 'href="/gravity-report-guests"' /tmp/gravity-report-catalog-live.html
          # Editorial landing must link only released articles, distinguish works in progress and preserve the operating catalog.
          grep -Fq 'The stories behind restaurant life. The systems that make it better.' /tmp/gravity-report-catalog-live.html
          grep -Fq 'id="report-feature"' /tmp/gravity-report-catalog-live.html
          grep -Fq 'id="report-series"' /tmp/gravity-report-catalog-live.html
          grep -Fq 'id="report-field-sheets"' /tmp/gravity-report-catalog-live.html
          grep -Fq 'These articles are not published yet.' /tmp/gravity-report-catalog-live.html
          grep -Fq 'href="/gravity-report/why-cant-i-keep-good-restaurant-employees"' /tmp/gravity-report-catalog-live.html
          grep -Fq '.report-feature-grid' /tmp/gravity-report-reader-css
          grep -Fq 'The same excuse. The same problem.' /tmp/gravity-report-reader-js
          echo 'GRAVITY_REPORT_MAGAZINE_LIVE_PASS'
          echo 'GRAVITY_GUEST_VOICES_LIVE_PASS'
          echo 'GRAVITY_REPORT_AUDIO_AND_SOCIAL_LINKS_LIVE_PASS'
          echo 'GRAVITY_REPORT_READING_AND_SHARING_LIVE_PASS'
          curl -fsSL "$base/robots.txt" | tee /tmp/gravity-robots.txt
          ! grep -q '^Disallow: /$' /tmp/gravity-robots.txt
          curl -fsSI "$base/assets/reader/bar-inventory.txt" | grep -iq '^x-robots-tag:.*noindex'
          echo 'GRAVITY_PUBLIC_DEPLOY_AND_INDEX_VERIFIED'
