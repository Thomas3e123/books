name: Finish Gravity Testing Room
on:
  push:
    paths:
      - 'scripts/_run_testing_room.trigger'
permissions:
  contents: write
jobs:
  finish-testing-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final Testing Room integration
        run: node scripts/finish-testing-room.cjs
      - name: Refresh controlled manifest
        run: node scripts/update-manifest.cjs
      - name: Verify controlled source
        run: node scripts/verify-source.cjs
      - name: Commit verified Testing Room release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site functions netlify source-manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Launch Gravity Testing Room and private tester messenger"
            git push
          fi
