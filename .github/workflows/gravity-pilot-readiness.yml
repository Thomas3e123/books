name: Gravity Pilot Room readiness
on:
  pull_request:
    paths:
      - 'site/pilot-room*'
      - 'site/assets/video/pilot/**'
      - 'functions/pilot-room/**'
      - 'tests/pilot-readiness.test.cjs'
      - 'scripts/test-pilot-room-browser.cjs'
      - 'scripts/test-pilot-room-database.cjs'
      - '.github/workflows/gravity-pilot-readiness.yml'
jobs:
  isolated-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pilotqa
          POSTGRES_PASSWORD: pilotqa
          POSTGRES_DB: pilotqa
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save --package-lock=false playwright pg
          npx playwright install --with-deps chromium
      - name: Verify source and isolated API regressions
        run: |
          node scripts/verify-source.cjs
          node --test tests/pilot-readiness.test.cjs
      - name: Exercise participant and manager UI with disposable records
        run: node scripts/test-pilot-room-browser.cjs
      - name: Exercise actual pilot persistence on disposable PostgreSQL
        env:
          PILOT_TEST_DATABASE_URL: postgresql://pilotqa:pilotqa@127.0.0.1:5432/pilotqa
        run: node scripts/test-pilot-room-database.cjs
