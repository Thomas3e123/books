name: Gravity public service readiness - NO DEPLOY
on:
  push:
    branches:
      - audit/gravity-parity-2026-10-22
    paths:
      - scripts/audit-gravity-public-health.cjs
      - .github/workflows/gravity-public-health.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only health requests for Gravity and TMB
        run: node scripts/audit-gravity-public-health.cjs
      - name: Preserve status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravity-public-health-2026-10-22
          path: gravity-public-services-health.json
          retention-days: 30
