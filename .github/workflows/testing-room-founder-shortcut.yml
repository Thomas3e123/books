name: Testing Room founder shortcut

on:
  push:
    branches: [main]
    paths:
      - 'scripts/set-testing-room-founder-shortcut-two-taps.cjs'
      - '.github/workflows/testing-room-founder-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Change founder shortcut to two taps
        run: node scripts/set-testing-room-founder-shortcut-two-taps.cjs
      - name: Verify shortcut
        run: |
          grep -q "if(c>=2){e.preventDefault();c=0;location.href='/testing-room-manager';}" site/testing-room.html
          if grep -q "if(c>=3){e.preventDefault();c=0;location.href='/testing-room-manager';}" site/testing-room.html; then
            echo 'Three-tap shortcut still present.'
            exit 1
          fi
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit two-tap shortcut
        run: |
          if git diff --quiet -- site/testing-room.html source-manifest.json; then
            echo "Two-tap shortcut is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/testing-room.html source-manifest.json
          git commit -m "Change founder shortcut to two taps"
          git pull --rebase origin main
          git push origin HEAD:main
