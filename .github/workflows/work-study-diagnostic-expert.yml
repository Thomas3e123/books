name: Work Study diagnostic expert

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/js/gravity-work-study-diagnostic-expert-v22.js'
      - 'scripts/work-study-diagnostic-expert-suite.cjs'
      - 'scripts/upgrade-work-study-lab-v2.cjs'
      - '.github/workflows/work-study-diagnostic-expert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check diagnostic expert syntax
        run: node --check site/assets/js/gravity-work-study-diagnostic-expert-v22.js
      - name: Run diagnostic expert regression suite
        run: node scripts/work-study-diagnostic-expert-suite.cjs
      - name: Install diagnostic expert in Work Study page
        run: node scripts/upgrade-work-study-lab-v2.cjs
      - name: Verify generated Work Study page
        run: |
          grep -q 'gravity-work-study-diagnostic-expert-v22.js?v=20261016-diagnostic-expert-v1' site/gravity-work-study-lab.html
          grep -q 'diagnostic problem-reframing and human-factor safeguards' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-earbud-mode-v18.js?v=20261016-guided-voice-v2' site/gravity-work-study-lab.html
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit generated Work Study page
        run: |
          if git diff --quiet -- site/gravity-work-study-lab.html source-manifest.json; then
            echo 'Generated Work Study page already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/gravity-work-study-lab.html source-manifest.json
          git commit -m 'Add Work Study diagnostic expert to generated page'
          git pull --rebase origin main
          git push origin HEAD:main
