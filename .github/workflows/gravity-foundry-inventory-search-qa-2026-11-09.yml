name: Gravity SOP and Inventory search fidelity QA
on:
  push:
    branches:
      - audit/foundry-inventory-search-2026-11-09
    paths:
      - '.github/workflows/gravity-foundry-inventory-search-qa-2026-11-09.yml'
      - 'tests/browser/foundry-inventory-search.spec.cjs'
      - 'site/apps/sop-foundry/staff-sops.js'
      - 'site/apps/inventory-center/assets/js/inventory-center.js'
      - 'source-manifest.json'
permissions:
  contents: read
jobs:
  search-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify source integrity
        run: node scripts/verify-source.cjs
      - name: Test synthetic published SOP and inventory search on desktop/mobile
        run: npx playwright test tests/browser/foundry-inventory-search.spec.cjs --reporter=line
