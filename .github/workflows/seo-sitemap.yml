name: Refresh Google sitemap
on:
  push:
    branches: [main]
    paths:
      - 'site/*.html'
      - '!site/sitemap.xml'
permissions:
  contents: write
jobs:
  sitemap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild sitemap from canonical public pages
        run: node scripts/update-sitemap.cjs
      - name: Refresh controlled manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit sitemap if changed
        run: |
          if git diff --quiet; then
            echo 'Sitemap already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/sitemap.xml source-manifest.json
          git commit -m 'Refresh Google sitemap from current public pages'
          git push
