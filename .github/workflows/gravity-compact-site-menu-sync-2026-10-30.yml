name: Gravity compact top menu — application room parity
on:
  push:
    branches: [feature/gravity-migration-phase1-2026-10-22]
    paths:
      - .github/workflows/gravity-compact-site-menu-sync-2026-10-30.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.ref == 'refs/heads/feature/gravity-migration-phase1-2026-10-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize only compact Site Menu labels and Report access
        run: |
          set -euo pipefail
          node scripts/synchronize-gravity-compact-site-menus.cjs
          node scripts/update-manifest.cjs
          node scripts/verify-source.cjs
      - name: Commit scoped HTML updates, not TMB
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site source-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only > /tmp/compact-menu-changes
          if grep -Ev '^site/.*\.html$|^source-manifest\.json$' /tmp/compact-menu-changes; then echo "Out of scope file"; exit 1; fi
          git commit -m "fix(gravity): make compact Site Menu consistent across SOP Foundry rooms [skip ci]"
          git fetch --no-tags origin feature/gravity-migration-phase1-2026-10-22
          git rebase origin/feature/gravity-migration-phase1-2026-10-22
          git push origin HEAD:feature/gravity-migration-phase1-2026-10-22
