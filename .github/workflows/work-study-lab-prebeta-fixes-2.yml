name: Work Study Lab pre-beta validation pass 2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/work-study-lab-prebeta-fixes-2.cjs'
      - '.github/workflows/work-study-lab-prebeta-fixes-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply second pre-beta pass
        run: node scripts/work-study-lab-prebeta-fixes-2.cjs
      - name: Syntax checks
        run: |
          node --check site/assets/js/gravity-work-study-v2.js
          node --check windows/gravity-work-study-lab/renderer.js
      - name: Evidence-rule checks
        run: |
          if grep -q "d.n>=3?'Strong'" site/assets/js/gravity-work-study-v2.js; then exit 1; fi
          if grep -q "v.length>=3?'Strong'" windows/gravity-work-study-lab/renderer.js; then exit 1; fi
          grep -q 'Observed role is required' site/assets/js/gravity-work-study-v2.js
          grep -q 'Define where the process starts and ends' windows/gravity-work-study-lab/renderer.js
      - name: Refresh source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/js/gravity-work-study-v2.js windows/gravity-work-study-lab/renderer.js source-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Tighten Work Study Lab evidence and required fields"
          git pull --rebase origin main
          git push origin HEAD:main
