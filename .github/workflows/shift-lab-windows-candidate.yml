name: Gravity Shift Lab Windows Candidate
on:
  push:
    branches: [main]
    paths:
      - 'windows/gravity-shift-lab/**'
      - 'site/gravity-shift-lab.html'
      - 'site/assets/js/gravity-shift-lab.js'
      - 'site/assets/js/gravity-shift-first-schedule-tour-v1.js'
      - '.github/workflows/shift-lab-windows-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-candidate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/gravity-shift-lab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm run sync:web
      - name: Verify packaged parity
        shell: pwsh
        run: |
          node --check main.js
          node --check sync-site.cjs
          node --check smoke.cjs
          node --check smoke-extended.cjs
          node --check app/assets/js/gravity-shift-lab.js
          node --check app/assets/js/gravity-shift-first-schedule-tour-v1.js
          if (-not (Test-Path app/PARITY_MANIFEST.json)) { throw 'Parity manifest missing' }
      - name: Run real Windows Shift Lab customer workflow smoke
        shell: pwsh
        run: |
          $env:GRAVITY_SHIFT_SMOKE = '1'
          npx electron .
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime smoke failed with exit code $LASTEXITCODE" }
      - name: Build Windows candidate
        run: npm run build:win
      - name: Install candidate silently on clean Windows runner and rerun end-to-end smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'dist/Gravity_Shift_Lab_Candidate_*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'gravity-shift-installed-smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed: $($install.ExitCode)" }
          $installed = Join-Path $destination 'Gravity Shift Lab Candidate.exe'
          if (-not (Test-Path $installed)) { throw "Installer exited but app missing: $installed" }
          $env:GRAVITY_SHIFT_SMOKE = '1'
          $application = Start-Process -FilePath $installed -Wait -PassThru
          if ($application.ExitCode -ne 0) { throw "Installed Windows application smoke failed: $($application.ExitCode)" }
          Write-Host "NSIS installation and installed Shift Lab runtime tests passed."
      - uses: actions/upload-artifact@v5
        with:
          name: Gravity-Shift-Lab-Windows-Candidate
          path: |
            windows/gravity-shift-lab/dist/*.exe
            windows/gravity-shift-lab/dist/*.zip
          if-no-files-found: error
