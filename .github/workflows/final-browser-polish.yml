name: Final browser polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-browser-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix shared accessible brand name and favicon fallback
        run: node scripts/final-browser-polish.cjs
      - name: Rebuild sitemap
        run: node scripts/update-sitemap.cjs
      - name: Refresh source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit verified browser polish
        run: |
          if git diff --quiet; then
            echo 'Browser-quality polish already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site source-manifest.json
          git commit -m 'Fix shared brand accessibility and favicon fallback'
          git push
