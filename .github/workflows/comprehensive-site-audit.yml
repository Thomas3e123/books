name: Comprehensive site audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/comprehensive-site-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run comprehensive source audit
        run: node scripts/comprehensive-site-audit.cjs
