name: Add role search guides
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-role-search-guides.yml'
permissions:
  contents: write
jobs:
  add-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add people-first role and kitchen guides
        run: node scripts/add-role-search-guides.cjs
      - name: Rebuild sitemap
        run: node scripts/update-sitemap.cjs
      - name: Refresh controlled manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit verified search-guide release
        run: |
          if git diff --quiet; then
            echo 'Role search guides already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site source-manifest.json
          git commit -m 'Add role-specific restaurant search guides'
          git push
