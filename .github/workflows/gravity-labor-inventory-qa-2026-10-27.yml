name: Gravity — Shift Lab and Inventory cost integrity QA (NO DEPLOY)
on:
  push:
    branches:
      - feature/gravity-migration-phase1-2026-10-22
    paths:
      - 'site/assets/js/gravity-labor-cost-engine.js'
      - 'site/assets/js/gravity-shift-lab.js'
      - 'site/gravity-shift-lab.html'
      - 'site/apps/inventory-center/assets/js/inventory-outflow-cost.js'
      - 'site/apps/inventory-center/assets/js/inventory-center.js'
      - 'site/apps/inventory-center/assets/js/inventory-validation.js'
      - 'site/apps/inventory-center/index.html'
      - 'scripts/test-gravity-labor-cost-engine.cjs'
      - 'scripts/test-gravity-inventory-outflow.cjs'
      - 'source-manifest.json'
      - '.github/workflows/gravity-labor-inventory-qa-2026-10-27.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify complete source manifest
        run: npm run build
      - name: Ensure manifest generated from the tree is identical
        run: |
          npm run manifest
          git diff --exit-code -- source-manifest.json
      - name: Check JavaScript syntax
        run: |
          node --check site/assets/js/gravity-labor-cost-engine.js
          node --check site/assets/js/gravity-shift-lab.js
          node --check site/apps/inventory-center/assets/js/inventory-outflow-cost.js
          node --check site/apps/inventory-center/assets/js/inventory-center.js
          node --check site/apps/inventory-center/assets/js/inventory-validation.js
      - name: Independently exercise labor forecast arithmetic and inputs
        run: node scripts/test-gravity-labor-cost-engine.cjs
      - name: Independently exercise inventory historical outflow and categories
        run: node scripts/test-gravity-inventory-outflow.cjs
      - name: Verify page wiring, privacy, optional historic fields and attribution safety
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const sh=fs.readFileSync('site/gravity-shift-lab.html','utf8');
          const sc=fs.readFileSync('site/assets/js/gravity-shift-lab.js','utf8');
          const inv=fs.readFileSync('site/apps/inventory-center/index.html','utf8');
          const ic=fs.readFileSync('site/apps/inventory-center/assets/js/inventory-center.js','utf8');
          const v=fs.readFileSync('site/apps/inventory-center/assets/js/inventory-validation.js','utf8');
          assert(sh.includes('id="manager-hourly-burden"'));
          assert(sh.includes('id="lab-private-budget"'));
          assert(sh.includes('id="lab-cost-basis"'));
          assert(sh.indexOf('src="assets/js/gravity-labor-cost-engine.js')<sh.indexOf('src="assets/js/gravity-shift-lab.js'));
          assert(sc.includes('profile.hourlyBurdenPercent'));
          assert(sh.includes('value="salary-only"'),'Management salary-only option missing');
          assert(sc.includes("profile.managementLaborMode==='salary-only'"),'Salary-only management cost calculation missing');
          assert(sc.includes('profile.lastViewedWeek'),'Last selected week must persist');
          assert(sc.includes("profile.lastViewedWeek||isoDate(sun)"),'Reopen last selected schedule week');
          assert(sc.includes('GravityLaborCostEngine.projected'));
          assert(sc.includes("payIsLocked()?'Labor budget dollars"));
          assert(sc.includes("profile.managementLaborMode==='exclude'?0"));
          assert(inv.includes('id="move-reason-code"'));
          assert(inv.includes('Outflow value'));
          assert(inv.indexOf('src="assets/js/inventory-outflow-cost.js')<inv.indexOf('src="assets/js/inventory-center.js'));
          assert(ic.includes('GravityInventoryOutflow.movementOutflowValue(x)'));
          assert(ic.includes('reasonCode:reasonCode'));
          assert(ic.includes('Outflow Cost (Waste/Spill/Spoilage/Damage/Comp Only)'));
          assert(v.includes('m.reasonCode!==undefined'));
          // The repository retains preview-stage noindex tags. Public deployment
          // packaging removes them on public pages while preserving private tags.
          for(const page of [sh,inv])assert(/name="robots" content="noindex,nofollow"/.test(page),'Preview-stage source missing noindex');
          const head=fs.readFileSync('site/_headers','utf8');
          assert(head.includes('X-Robots-Tag: noindex, nofollow'),'Sensitive paths need explicit noindex');
          assert(!/^\/\*\s*\n\s*X-Robots-Tag:\s*noindex/im.test(head),'Public wildcard must not be noindex');
          console.log('GRAVITY_QA_PAGE_WIRING_AND_PRIVACY PASS — NO DEPLOY');
          NODE
      - name: Exercise additional financial boundaries and loss-category assumptions
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const L=require('./site/assets/js/gravity-labor-cost-engine.js');
          const I=require('./site/apps/inventory-center/assets/js/inventory-outflow-cost.js');
          const tol=(a,b)=>assert(Math.abs(a-b)<0.000001, a+' != '+b);
          const p=L.projected({hourlyWages:2400,salaryAllocation:600,forecastSales:15000,targetPercent:25});
          tol(p.total,3000);tol(p.laborPercent,20);tol(p.budgetVariance,-750);
          assert.equal(p.burdenConfigured,false,'Never assume a preset tax/burden percentage');
          const loaded=L.projected({hourlyWages:2400,salaryAllocation:600,hourlyBurdenPercent:12.5,forecastSales:15000,targetPercent:25});
          tol(loaded.total,3300);tol(loaded.employerBurden,300);
          tol(loaded.salaryAllocation,600);
          assert.equal(L.projected({hourlyWages:100,forecastSales:0}).laborPercent,null,'Do not divide labor by zero sales');
          for(const v of ['bad','-4','Infinity','101'])assert.throws(()=>L.projected({hourlyWages:100,hourlyBurdenPercent:v}));
          for(const t of ['waste','spill','spoilage','damage','comp'])tol(I.movementOutflowValue({type:t,qty:4,unitCost:2.25}),9);
          for(const t of ['count-adjustment','receiving','transfer'])assert.equal(I.movementOutflowValue({type:t,qty:4,unitCost:2.25}),null);
          assert.equal(I.movementOutflowValue({type:'waste',qty:2,unitCost:''}),null,'Missing historical cost must remain unknown');
          assert.equal(I.movementOutflowValue({type:'damage',qty:2,unitCost:-5}),null);
          console.log('GRAVITY_CHARTER_MATH_BOUNDARIES PASS — explicit assumptions, no invented theft or burden');
          NODE
      - name: Confirm customer feedback and real-world retest entry points
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const html=fs.readFileSync('site/testing-room.html','utf8');
          for(const s of ['id="join-btn"','id="msg-body"','data-kind="problem"','data-kind="confusing"','data-kind="idea"','data-kind="worked"','/gravity-shift-lab','/gravity-inventory-center']) {
            assert(html.includes(s),'Customer feedback/testing entry missing: '+s);
          }
          for(const snippet of ['id="gravity-field-test-guide"','Use practice employees, fictional wages','Open Shift Lab','Open Inventory Center','contact Gravity']) assert(html.includes(snippet),'Customer trial guide missing: '+snippet);
          const policy=fs.readFileSync('docs/gravity-charter-release-review.md','utf8');
          assert(policy.includes('Customer-assisted improvement'),'Missing customer feedback release policy');
          const audit=fs.readFileSync('docs/gravity-charter-audit-shift-inventory-2026-10-28.md','utf8');
          assert(audit.includes('Customer-assisted acceptance'),'Missing real-world acceptance scenarios');
          console.log('GRAVITY_CUSTOMER_FEEDBACK_ENTRYPOINT PASS — checks source availability, not genuine customer acceptance');
          NODE
      - name: Verify separate PUBLIC packaging without deploying or touching TMB
        run: |
          set -euo pipefail
          node scripts/prepare-gravity-public-launch.cjs
          node scripts/update-gravity-footer.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          for(const path of ['site/index.html','site/about.html','site/start-here.html','site/gravity-report.html','site/gravity-shift-lab.html','site/apps/inventory-center/index.html']) {
            const html=fs.readFileSync(path,'utf8');
            assert(!/<meta[^>]+content=["']noindex/i.test(html),'Unexpected public noindex: '+path);
            assert(!html.includes('gravity-leadership-system.netlify.app'),'Unexpected preview canonical: '+path);
          }
          for(const path of ['site/testing-room-manager.html','site/apps/sop-foundry/employee-app.html']) {
            assert(/noindex,nofollow/.test(fs.readFileSync(path,'utf8')),'Private page must remain noindex: '+path);
          }
          const h=fs.readFileSync('site/_headers','utf8');
          assert(!/^\/\*\s*\n\s*X-Robots-Tag:\s*noindex/im.test(h),'Public wildcard noindex');
          const r=fs.readFileSync('site/robots.txt','utf8');
          assert(!r.includes('Disallow: /\n'),'Public site crawling disabled');
          assert(r.includes('Disallow: /testing-room-manager'),'Missing private disallow');
          assert(fs.readFileSync('site/index.html','utf8').includes('Publisher and Editor of The Gravity Report'),'Editorial attribution missing');
          console.log('GRAVITY_CHARTER_PUBLIC_PACKAGING PASS — public SEO, sensitive paths protected, TMB untouched, NO DEPLOY');
          NODE
