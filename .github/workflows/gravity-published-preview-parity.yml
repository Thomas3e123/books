name: Gravity released preview — compare live desktop/mobile navigation (NO DEPLOY)
on:
  push:
    branches:
      - audit/gravity-parity-2026-10-22
    paths:
      - '.github/workflows/gravity-published-preview-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare browser for read-only published-site comparison
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify LIVE published Gravity vs LIVE existing TMB
        run: node scripts/migration-live-parity.cjs
      - name: Save full menu geometry and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-published-preview-mobile-desktop-menu-check
          path: |
            gravity-nav-parity.json
            gravity-nav-*.png
          retention-days: 30
