name: Work Study Windows timer integrity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/work-study-windows-timer-integrity.cjs'
      - '.github/workflows/work-study-windows-timer-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Windows timing integrity
        run: node scripts/work-study-windows-timer-integrity.cjs
      - name: Verify Windows renderer
        run: |
          node --check windows/gravity-work-study-lab/renderer.js
          grep -q "function renderObserve(){stopTimer(true);" windows/gravity-work-study-lab/renderer.js
          ! grep -q "function renderObserve(){stopTimer(false);" windows/gravity-work-study-lab/renderer.js
      - name: Refresh source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit corrected Windows source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/gravity-work-study-lab/renderer.js source-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Protect Windows Work Study active timing evidence"
          git pull --rebase origin main
          git push origin HEAD:main
