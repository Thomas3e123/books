name: Work Study Guided expert interview

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/js/gravity-work-study-*.js'
      - 'functions/work-study-process-file/**'
      - 'scripts/work-study-*.cjs'
      - '.github/workflows/work-study-guided-expert-interview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guided-expert-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check all Work Study JavaScript syntax
        run: |
          set -e
          for f in site/assets/js/gravity-work-study-*.js; do
            echo "Syntax: $f"
            node --check "$f"
          done
          node --check functions/work-study-process-file/work-study-process-file.js
      - name: Run every Work Study regression suite
        run: |
          set -e
          for f in scripts/work-study-*-suite.cjs; do
            echo "Regression: $f"
            node "$f"
          done
      - name: Verify Guided teaching safety
        run: |
          grep -q "gravity-work-study-teaching" site/assets/js/gravity-work-study-earbud-mode-v18.js
          grep -q "s?.timer?.running" site/assets/js/gravity-work-study-earbud-mode-v18.js
          grep -q "if(s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-standard-minutes-v33.js
          grep -q "if(s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-scaling-expert-v39.js
          grep -q "if(s.mode!=='guided'||s.timer?.running||!a.changed)return" site/assets/js/gravity-work-study-baseline-provenance-v40.js
          grep -q "if(s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-allowance-expert-v41.js
          grep -q "if(!a.applicable||s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-observer-agreement-v42.js
          grep -q "if(s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-proficiency-v43.js
          grep -q "if(s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-observation-effect-v44.js
          grep -q "if(s.mode!=='guided'||s.timer?.running||a.n<2)return" site/assets/js/gravity-work-study-precision-v45.js
          grep -q "if(!a.applicable||s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-demand-coverage-v46.js
          grep -q "if(!a.applicable||s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-shared-setup-v47.js
          grep -q "if(!a.applicable||s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-crew-labor-v48.js
          grep -q "if(!a.applicable||s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-yield-quality-v49.js
          grep -q "if(!a.applicable||s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-work-sampling-v50.js
          grep -q "if(!a.applicable||s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-queue-recovery-v51.js
          grep -q "if(!a.applicable||s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-incomplete-cycle-v52.js
          grep -q "if(!a.applicable||s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-short-element-v53.js
          grep -q "if(!a.applicable||s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-shift-position-v54.js
          grep -q "if(!a.applicable||s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-changeover-sequence-v55.js
      - name: Install expert stack in Work Study page
        run: node scripts/upgrade-work-study-lab-v2.cjs
      - name: Verify generated Work Study page
        run: |
          grep -q 'gravity-work-study-guided-expert-interview-v26.js?v=20261016-guided-expert-interview-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-run-comparability-v31.js?v=20261016-unit-aware-comparability-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-standard-minutes-v33.js?v=20261016-standard-minutes-v33' site/gravity-work-study-lab.html
          ! grep -q 'gravity-work-study-standard-minutes-v32.js' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-clock-control-v32.js?v=20261016-clock-control-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-process-map-v34.js?v=20261016-process-map-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-concurrent-process-v35.js?v=20261016-concurrent-process-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-labor-occupancy-v36.js?v=20261016-labor-occupancy-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-segment-reference-v37.js?v=20261016-segment-reference-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-practical-units-v38.js?v=20261016-practical-units-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-scaling-expert-v39.js?v=20261016-scaling-expert-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-baseline-provenance-v40.js?v=20261016-baseline-provenance-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-allowance-expert-v41.js?v=20261016-allowance-expert-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-observer-agreement-v42.js?v=20261016-observer-agreement-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-proficiency-v43.js?v=20261016-proficiency-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-observation-effect-v44.js?v=20261016-observation-effect-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-precision-v45.js?v=20261016-precision-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-demand-coverage-v46.js?v=20261016-demand-coverage-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-shared-setup-v47.js?v=20261016-shared-setup-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-crew-labor-v48.js?v=20261016-crew-labor-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-yield-quality-v49.js?v=20261016-yield-quality-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-work-sampling-v50.js?v=20261016-work-sampling-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-queue-recovery-v51.js?v=20261016-queue-recovery-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-incomplete-cycle-v52.js?v=20261016-incomplete-cycle-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-short-element-v53.js?v=20261016-short-element-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-shift-position-v54.js?v=20261016-shift-position-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-changeover-sequence-v55.js?v=20261016-changeover-sequence-v1' site/gravity-work-study-lab.html
          grep -q 'unit-aware standard-minute validity with planning/candidate/verified evidence levels' site/gravity-work-study-lab.html
          grep -q 'fixed-versus-variable batch scaling with capacity-breakpoint safeguards' site/gravity-work-study-lab.html
          grep -q 'verified-baseline provenance and automatic revalidation holds after controlled changes' site/gravity-work-study-lab.html
          grep -q 'explicit observed-work versus staffing-allowance control with no invented default allowance' site/gravity-work-study-lab.html
          grep -q 'optional paired-observer and start-stop boundary calibration' site/gravity-work-study-lab.html
          grep -q 'proficiency representativeness that separates process evidence from employee ranking' site/gravity-work-study-lab.html
          grep -q 'observation-effect review that distinguishes timing awareness from employee intent' site/gravity-work-study-lab.html
          grep -q '95% measurement-precision ranges with explicit internal decision bands' site/gravity-work-study-lab.html
          grep -q 'structured demand-period and product-mix coverage without artificial production' site/gravity-work-study-lab.html
          grep -q 'shared setup and cleanup allocation that preserves raw timing evidence and prevents repeated fixed-labor charging' site/gravity-work-study-lab.html
          grep -q 'sequence-dependent changeover evidence that keeps A-to-B separate from B-to-A unless equivalence is proven and preserves required cleaning/sanitation/allergen/safety resets' site/gravity-work-study-lab.html
          grep -q 'crew labor accounting that separates elapsed process time from summed engaged worker time and prohibits headcount multiplication' site/gravity-work-study-lab.html
          grep -q 'yield and waste protection that prevents speed gains from overriding restaurant-approved usable-output boundaries' site/gravity-work-study-lab.html
          grep -q 'method-specific Work Sampling with snapshot capture, representative observation-schedule safeguards, Wilson uncertainty intervals, and decision-specific precision targets' site/gravity-work-study-lab.html
          grep -q 'queue and recovery analysis that reconstructs burst-driven backlog instead of relying on average rates' site/gravity-work-study-lab.html
          grep -q 'incomplete-cycle protection that preserves aborted/restarted attempts and prevents successful-cycle survivorship bias' site/gravity-work-study-lab.html
          grep -q 'short-element measurement adequacy based on observable repeatable boundaries rather than stopwatch decimal display or a made-up universal cutoff' site/gravity-work-study-lab.html
          grep -q 'extended-window shift-position representativeness that requires early/middle/later evidence without inferring employee fatigue or intent' site/gravity-work-study-lab.html
          grep -q 'practical restaurant-readable timing units' site/gravity-work-study-lab.html
          grep -q 'condition-equivalence checks' site/gravity-work-study-lab.html
          grep -q 'parallel machine/process clocks' site/gravity-work-study-lab.html
          grep -q 'ingredient-aware DOCX/text process mapping' site/gravity-work-study-lab.html
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit generated Work Study page
        run: |
          if git diff --quiet -- site/gravity-work-study-lab.html source-manifest.json; then
            echo "Work Study expert source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/gravity-work-study-lab.html source-manifest.json
          git commit -m "Install current Work Study expert stack"
          git pull --rebase origin main
          git push origin HEAD:main
