name: Work Study Guided expert interview

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/js/gravity-work-study-guided-expert-interview-v26.js'
      - 'site/assets/js/gravity-work-study-guided-expert-adaptive-v27.js'
      - 'site/assets/js/gravity-work-study-production-pause-v28.js'
      - 'site/assets/js/gravity-work-study-confidence-expert-v29.js'
      - 'site/assets/js/gravity-work-study-run-comparability-v31.js'
      - 'site/assets/js/gravity-work-study-clock-control-v32.js'
      - 'site/assets/js/gravity-work-study-earbud-mode-v18.js'
      - 'scripts/work-study-guided-expert-interview-suite.cjs'
      - 'scripts/work-study-adaptive-expert-suite.cjs'
      - 'scripts/work-study-production-pause-suite.cjs'
      - 'scripts/work-study-confidence-expert-suite.cjs'
      - 'scripts/work-study-run-comparability-suite.cjs'
      - 'scripts/work-study-clock-control-suite.cjs'
      - 'scripts/upgrade-work-study-lab-v2.cjs'
      - '.github/workflows/work-study-guided-expert-interview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guided-expert-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check Guided expert JavaScript syntax
        run: |
          node --check site/assets/js/gravity-work-study-guided-expert-interview-v26.js
          node --check site/assets/js/gravity-work-study-guided-expert-adaptive-v27.js
          node --check site/assets/js/gravity-work-study-production-pause-v28.js
          node --check site/assets/js/gravity-work-study-confidence-expert-v29.js
          node --check site/assets/js/gravity-work-study-run-comparability-v31.js
          node --check site/assets/js/gravity-work-study-clock-control-v32.js
          node --check site/assets/js/gravity-work-study-earbud-mode-v18.js
      - name: Run Guided expert interview regression suite
        run: node scripts/work-study-guided-expert-interview-suite.cjs
      - name: Run adaptive expert regression suite
        run: node scripts/work-study-adaptive-expert-suite.cjs
      - name: Run production pause regression suite
        run: node scripts/work-study-production-pause-suite.cjs
      - name: Run confidence calibration regression suite
        run: node scripts/work-study-confidence-expert-suite.cjs
      - name: Run production run comparability regression suite
        run: node scripts/work-study-run-comparability-suite.cjs
      - name: Run clock control regression suite
        run: node scripts/work-study-clock-control-suite.cjs
      - name: Verify voice prefers expert checkpoint
        run: grep -q "\[data-ws26\] .ws26-q" site/assets/js/gravity-work-study-earbud-mode-v18.js
      - name: Install Guided expert interview in Work Study page
        run: node scripts/upgrade-work-study-lab-v2.cjs
      - name: Verify generated Work Study page
        run: |
          grep -q 'gravity-work-study-guided-expert-interview-v26.js?v=20261016-guided-expert-interview-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-guided-expert-adaptive-v27.js?v=20261016-adaptive-expert-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-production-pause-v28.js?v=20261016-production-pause-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-confidence-expert-v29.js?v=20261016-confidence-expert-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-run-comparability-v31.js?v=20261016-run-comparability-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-clock-control-v32.js?v=20261016-clock-control-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-earbud-mode-v18.js?v=20261016-guided-voice-v3' site/gravity-work-study-lab.html
          grep -q 'optional natural-language hands-free clock control with user, Gravity, or Hybrid ownership' site/gravity-work-study-lab.html
          grep -q 'production-safe pause/resume across normal production runs' site/gravity-work-study-lab.html
          grep -q 'production-run comparability checks across batch size, yield, equipment, operator, and conditions' site/gravity-work-study-lab.html
          grep -q 'confidence calibration that identifies the most valuable next evidence' site/gravity-work-study-lab.html
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit generated Work Study page
        run: |
          if git diff --quiet -- site/gravity-work-study-lab.html source-manifest.json; then
            echo "Guided expert and clock-control source are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/gravity-work-study-lab.html source-manifest.json
          git commit -m "Install Work Study clock control"
          git pull --rebase origin main
          git push origin HEAD:main
