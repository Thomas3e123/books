name: Work Study Guided expert interview

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/js/gravity-work-study-guided-expert-interview-v26.js'
      - 'site/assets/js/gravity-work-study-guided-expert-adaptive-v27.js'
      - 'site/assets/js/gravity-work-study-production-pause-v28.js'
      - 'site/assets/js/gravity-work-study-confidence-expert-v29.js'
      - 'site/assets/js/gravity-work-study-run-comparability-v31.js'
      - 'site/assets/js/gravity-work-study-standard-minutes-v32.js'
      - 'site/assets/js/gravity-work-study-clock-control-v32.js'
      - 'site/assets/js/gravity-work-study-synthesis-v24.js'
      - 'site/assets/js/gravity-work-study-process-map-v34.js'
      - 'site/assets/js/gravity-work-study-concurrent-process-v35.js'
      - 'site/assets/js/gravity-work-study-labor-occupancy-v36.js'
      - 'site/assets/js/gravity-work-study-segment-reference-v37.js'
      - 'site/assets/js/gravity-work-study-earbud-mode-v18.js'
      - 'functions/work-study-process-file/**'
      - 'scripts/work-study-guided-expert-interview-suite.cjs'
      - 'scripts/work-study-adaptive-expert-suite.cjs'
      - 'scripts/work-study-production-pause-suite.cjs'
      - 'scripts/work-study-confidence-expert-suite.cjs'
      - 'scripts/work-study-run-comparability-suite.cjs'
      - 'scripts/work-study-standard-minutes-suite.cjs'
      - 'scripts/work-study-synthesis-integration-suite.cjs'
      - 'scripts/work-study-process-map-suite.cjs'
      - 'scripts/work-study-process-file-suite.cjs'
      - 'scripts/work-study-labor-occupancy-suite.cjs'
      - 'scripts/work-study-segment-reference-suite.cjs'
      - 'scripts/work-study-clock-control-suite.cjs'
      - 'scripts/upgrade-work-study-lab-v2.cjs'
      - '.github/workflows/work-study-guided-expert-interview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guided-expert-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check Guided expert JavaScript syntax
        run: |
          node --check site/assets/js/gravity-work-study-guided-expert-interview-v26.js
          node --check site/assets/js/gravity-work-study-guided-expert-adaptive-v27.js
          node --check site/assets/js/gravity-work-study-production-pause-v28.js
          node --check site/assets/js/gravity-work-study-confidence-expert-v29.js
          node --check site/assets/js/gravity-work-study-run-comparability-v31.js
          node --check site/assets/js/gravity-work-study-standard-minutes-v32.js
          node --check site/assets/js/gravity-work-study-clock-control-v32.js
          node --check site/assets/js/gravity-work-study-synthesis-v24.js
          node --check site/assets/js/gravity-work-study-process-map-v34.js
          node --check site/assets/js/gravity-work-study-concurrent-process-v35.js
          node --check site/assets/js/gravity-work-study-labor-occupancy-v36.js
          node --check site/assets/js/gravity-work-study-segment-reference-v37.js
          node --check site/assets/js/gravity-work-study-earbud-mode-v18.js
          node --check functions/work-study-process-file/work-study-process-file.js
      - name: Run Guided expert interview regression suite
        run: node scripts/work-study-guided-expert-interview-suite.cjs
      - name: Run adaptive expert regression suite
        run: node scripts/work-study-adaptive-expert-suite.cjs
      - name: Run production pause regression suite
        run: node scripts/work-study-production-pause-suite.cjs
      - name: Run confidence calibration regression suite
        run: node scripts/work-study-confidence-expert-suite.cjs
      - name: Run production run comparability regression suite
        run: node scripts/work-study-run-comparability-suite.cjs
      - name: Run standard-minute validity regression suite
        run: node scripts/work-study-standard-minutes-suite.cjs
      - name: Run synthesis integration regression suite
        run: node scripts/work-study-synthesis-integration-suite.cjs
      - name: Run process-map regression suite
        run: node scripts/work-study-process-map-suite.cjs
      - name: Run real DOCX process-file regression suite
        run: node scripts/work-study-process-file-suite.cjs
      - name: Run parallel labor occupancy regression suite
        run: node scripts/work-study-labor-occupancy-suite.cjs
      - name: Run segment-reference evidence regression suite
        run: node scripts/work-study-segment-reference-suite.cjs
      - name: Run clock control regression suite
        run: node scripts/work-study-clock-control-suite.cjs
      - name: Verify Guided teaching is blocked during active timing
        run: |
          grep -q "gravity-work-study-teaching" site/assets/js/gravity-work-study-earbud-mode-v18.js
          grep -q "s?.timer?.running" site/assets/js/gravity-work-study-earbud-mode-v18.js
      - name: Install Guided expert interview in Work Study page
        run: node scripts/upgrade-work-study-lab-v2.cjs
      - name: Verify generated Work Study page
        run: |
          grep -q 'gravity-work-study-guided-expert-interview-v26.js?v=20261016-guided-expert-interview-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-guided-expert-adaptive-v27.js?v=20261016-adaptive-expert-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-production-pause-v28.js?v=20261016-production-pause-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-confidence-expert-v29.js?v=20261016-confidence-expert-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-run-comparability-v31.js?v=20261016-unit-aware-comparability-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-standard-minutes-v32.js?v=20261016-standard-minutes-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-clock-control-v32.js?v=20261016-clock-control-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-process-map-v34.js?v=20261016-process-map-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-concurrent-process-v35.js?v=20261016-concurrent-process-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-labor-occupancy-v36.js?v=20261016-labor-occupancy-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-segment-reference-v37.js?v=20261016-segment-reference-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-earbud-mode-v18.js?v=20261016-guided-teaching-v4' site/gravity-work-study-lab.html
          grep -q 'restaurant-local verified segment references that never masquerade as direct evidence' site/gravity-work-study-lab.html
          grep -q 'parallel machine/process clocks' site/gravity-work-study-lab.html
          grep -q 'ingredient-aware DOCX/text process mapping' site/gravity-work-study-lab.html
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit generated Work Study page
        run: |
          if git diff --quiet -- site/gravity-work-study-lab.html source-manifest.json; then
            echo "Guided expert and segment-reference source are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add site/gravity-work-study-lab.html source-manifest.json
          git commit -m "Install Work Study segment reference expert"
          git pull --rebase origin main
          git push origin HEAD:main
