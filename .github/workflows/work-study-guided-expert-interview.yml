name: Work Study Guided expert interview

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/js/gravity-work-study-*.js'
      - 'functions/work-study-process-file/**'
      - 'scripts/work-study-*.cjs'
      - '.github/workflows/work-study-guided-expert-interview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guided-expert-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check all Work Study JavaScript syntax
        run: |
          set -e
          for f in site/assets/js/gravity-work-study-*.js; do
            echo "Syntax: $f"
            node --check "$f"
          done
          node --check functions/work-study-process-file/work-study-process-file.js
      - name: Run every Work Study regression suite
        run: |
          set -e
          for f in scripts/work-study-*-suite.cjs; do
            echo "Regression: $f"
            node "$f"
          done
      - name: Verify Guided teaching safety
        run: |
          grep -q "gravity-work-study-teaching" site/assets/js/gravity-work-study-earbud-mode-v18.js
          grep -q "s?.timer?.running" site/assets/js/gravity-work-study-earbud-mode-v18.js
          grep -q "if(s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-standard-minutes-v33.js
          grep -q "if(s.mode!=='guided'||s.timer?.running)return" site/assets/js/gravity-work-study-scaling-expert-v39.js
      - name: Install expert stack in Work Study page
        run: node scripts/upgrade-work-study-lab-v2.cjs
      - name: Verify generated Work Study page
        run: |
          grep -q 'gravity-work-study-guided-expert-interview-v26.js?v=20261016-guided-expert-interview-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-run-comparability-v31.js?v=20261016-unit-aware-comparability-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-standard-minutes-v33.js?v=20261016-standard-minutes-v33' site/gravity-work-study-lab.html
          ! grep -q 'gravity-work-study-standard-minutes-v32.js' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-clock-control-v32.js?v=20261016-clock-control-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-process-map-v34.js?v=20261016-process-map-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-concurrent-process-v35.js?v=20261016-concurrent-process-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-labor-occupancy-v36.js?v=20261016-labor-occupancy-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-segment-reference-v37.js?v=20261016-segment-reference-v2' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-practical-units-v38.js?v=20261016-practical-units-v1' site/gravity-work-study-lab.html
          grep -q 'gravity-work-study-scaling-expert-v39.js?v=20261016-scaling-expert-v1' site/gravity-work-study-lab.html
          grep -q 'unit-aware standard-minute validity with planning/candidate/verified evidence levels' site/gravity-work-study-lab.html
          grep -q 'fixed-versus-variable batch scaling with capacity-breakpoint safeguards' site/gravity-work-study-lab.html
          grep -q 'practical restaurant-readable timing units' site/gravity-work-study-lab.html
          grep -q 'condition-equivalence checks' site/gravity-work-study-lab.html
          grep -q 'parallel machine/process clocks' site/gravity-work-study-lab.html
          grep -q 'ingredient-aware DOCX/text process mapping' site/gravity-work-study-lab.html
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit generated Work Study page
        run: |
          if git diff --quiet -- site/gravity-work-study-lab.html source-manifest.json; then
            echo "Work Study expert source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/gravity-work-study-lab.html source-manifest.json
          git commit -m "Install current Work Study expert stack"
          git pull --rebase origin main
          git push origin HEAD:main
