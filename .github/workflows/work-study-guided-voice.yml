name: Work Study Guided voice

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/js/gravity-work-study-earbud-mode-v18.js'
      - 'scripts/work-study-earbud-mode-suite.cjs'
      - 'scripts/upgrade-work-study-lab-v2.cjs'
      - '.github/workflows/work-study-guided-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guided-voice-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check Guided voice syntax
        run: node --check site/assets/js/gravity-work-study-earbud-mode-v18.js
      - name: Run Guided voice regression suite
        run: node scripts/work-study-earbud-mode-suite.cjs
      - name: Install Guided voice in Work Study page
        run: node scripts/upgrade-work-study-lab-v2.cjs
      - name: Verify generated Work Study page
        run: |
          grep -q 'gravity-work-study-earbud-mode-v18.js?v=20261016-guided-voice-v2' site/gravity-work-study-lab.html
          grep -q "Hello. I’m Gravity. I’ll take you through this." site/assets/js/gravity-work-study-earbud-mode-v18.js
          grep -q 'pointerdown' site/assets/js/gravity-work-study-earbud-mode-v18.js
          grep -q 'startNow' site/assets/js/gravity-work-study-earbud-mode-v18.js
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit generated Work Study page
        run: |
          if git diff --quiet -- site/gravity-work-study-lab.html source-manifest.json; then
            echo "Guided voice page is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/gravity-work-study-lab.html source-manifest.json
          git commit -m "Make Work Study Guided voice start immediately"
          git pull --rebase origin main
          git push origin HEAD:main
