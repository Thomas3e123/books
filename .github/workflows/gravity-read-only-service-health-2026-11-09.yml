name: Gravity read-only live service health
on:
  push:
    branches:
      - audit/live-service-health-2026-11-09
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production services with GET-only requests
        run: node scripts/audit-gravity-live-services-2026-11-09.mjs
      - name: Verify isolated cloud backup authorization, conflicts and recovery history
        run: node scripts/test-gravity-cloud-backup.mjs
      - name: Install isolated browser QA dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
          google-chrome --version
      - name: Verify encrypted browser upload and second-device simulated restore
        run: node scripts/test-gravity-cloud-vault-browser.mjs
      - name: Verify free access and future paid-license safeguards without Square calls
        run: node scripts/test-handbook-public.mjs
