name: Gravity live noindex source — inspect deployed _headers (READ ONLY)
on:
  push:
    branches: ['feature/gravity-migration-phase1-2026-10-22']
    paths: ['.github/workflows/gravity-live-headers-source-readonly-2026-10-27.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN_A: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      TOKEN_B: ${{ secrets.NETLIFY_TOKEN }}
      TOKEN_C: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
    steps:
      - name: Inspect deployed header file and site-level metadata; NO WRITES
        shell: bash
        run: |
          set -euo pipefail
          token="${TOKEN_A:-${TOKEN_B:-${TOKEN_C:-}}}"
          test -n "$token"
          site='fa5d39a0-bef9-4ff1-9c28-57d585d741d7'
          base='https://api.netlify.com/api/v1/sites'
          hdr="$(mktemp)"
          code=$(curl -sS --max-time 25 -H "Authorization: Bearer $token" -H 'Content-Type: application/vnd.bitballoon.v1.raw' -o "$hdr" -w '%{http_code}' "$base/$site/files/_headers")
          echo "DEPLOYED_HEADERS_STATUS $code"
          if [ "$code" = 200 ]; then
            if grep -qi '^  X-Robots-Tag: noindex, nofollow' "$hdr"; then echo 'DEPLOYED_HEADERS_WILDCARD_NOINDEX_PRESENT'; else echo 'DEPLOYED_HEADERS_WILDCARD_NOINDEX_ABSENT'; fi
            echo 'DEPLOYED_HEADERS_PREFIX'
            head -12 "$hdr"
            echo 'DEPLOYED_HEADERS_ROBOT_STANZAS'
            grep -nEi '(X-Robots|^/apps|^/e|^/registration|^/testing-room|^/\*)' "$hdr" | head -55
          fi
          site_json="$(mktemp)"
          curl -fsS --max-time 25 -H "Authorization: Bearer $token" "$base/$site" -o "$site_json"
          SITE_FILE="$site_json" node - <<'NODE'
          const fs=require('node:fs');const s=JSON.parse(fs.readFileSync(process.env.SITE_FILE,'utf8'));
          for(const key of ['id','name','custom_domain','domain_aliases','force_ssl','processing','managed_dns','prerender','headers','branch','deploy_id','published_deploy'])
            console.log('SITE_METADATA '+key+' '+JSON.stringify(key==='published_deploy'?s[key]?.id:s[key]));
          NODE
          echo 'DEPLOYED_FILE_MANIFEST_INSPECTION'
          manifest="$(mktemp)"
          file_status=$(curl -sS --max-time 30 -H "Authorization: Bearer $token" -o "$manifest" -w '%{http_code}' "$base/$site/files?per_page=10000")
          echo "MANIFEST_STATUS $file_status"
          if [ "$file_status" = 200 ]; then
            MANIFEST_FILE="$manifest" node - <<'NODE'
          const fs=require('node:fs');
          const items=JSON.parse(fs.readFileSync(process.env.MANIFEST_FILE,'utf8'));
          for(const name of ['/_headers','/index.html','/about.html','/robots.txt','/gravity-report.html']){
            const entry=items.find(f=>f.path===name||f.id===name);
            console.log('DEPLOY_FILE',name,entry?JSON.stringify({sha:entry.sha,size:entry.size,mime_type:entry.mime_type}):'NOT_LISTED');
          }
          console.log('TOTAL_FILE_ENTRIES',items.length);
          NODE
          fi
          echo 'OTHER_DEPLOY_ENDPOINTS_DIAGNOSTIC'
          for p in "/sites/$site/files/index.html" "/deploys/6ae0aa29e84d203e63a4b0e6/files/_headers"; do
            tmp="$(mktemp)"
            status=$(curl -sS --max-time 20 -H "Authorization: Bearer $token" -o "$tmp" -w '%{http_code}' "https://api.netlify.com/api/v1$p")
            echo "FILE_ENDPOINT $p HTTP $status"
            if [ "$status" = 200 ];then head -c 300 "$tmp";echo;fi
            rm -f "$tmp"
          done
          echo 'MUTATIONS NONE'
