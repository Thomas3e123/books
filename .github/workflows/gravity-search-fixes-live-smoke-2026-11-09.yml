name: Gravity deployed search and SOP save fixes read-only smoke test
on:
  push:
    branches:
      - audit/live-service-health-2026-11-09
    paths:
      - '.github/workflows/gravity-search-fixes-live-smoke-2026-11-09.yml'
      - 'scripts/qa-gravity-live-search-fix-release-2026-11-09.mjs'
permissions:
  contents: read
jobs:
  verify-published-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm deployed public assets include Help, Inventory and Save SOP fixes
        run: node scripts/qa-gravity-live-search-fix-release-2026-11-09.mjs
