name: Gravity live first-visitor journey QA - intercepted registrations
on:
  push:
    branches:
      - audit/live-registration-journey-2026-11-09
    paths:
      - .github/workflows/gravity-live-registration-journey-qa-2026-11-09.yml
permissions:
  contents: read
jobs:
  live-visitor-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright in temporary runner (no production deployment)
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test desktop and Pixel 7 registration, Reader and download journey
        run: node scripts/audit-gravity-live-registration-journey-2026-11-09.mjs
