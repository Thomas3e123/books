name: Work Study Lab source guard

on:
  push:
    branches: [main]
    paths:
      - 'site/gravity-work-study-lab.html'
      - 'site/assets/js/gravity-work-study.js'
      - '.github/workflows/work-study-lab-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Refresh reviewed-source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit refreshed manifest if needed
        run: |
          if git diff --quiet -- source-manifest.json; then
            echo "Manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-manifest.json
          git commit -m "Refresh source manifest for Work Study Lab"
          git pull --rebase origin main
          git push origin HEAD:main
