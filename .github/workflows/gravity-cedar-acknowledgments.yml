name: Gravity Cedar prerecorded acknowledgments — staging only
on:
  push:
    branches:
      - feature/gravity-migration-phase1-2026-10-22
    paths:
      - .github/workflows/gravity-cedar-acknowledgments.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate reusable Cedar audio on staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/audio/gravity-ack
          python3 - <<'PY'
          import json,urllib.request,pathlib,time
          lines=['Hold on. Let me check.','Just a second. I will check.','I will work on that now.','Okay, yes. I will find out.','I am getting your answer as we speak.','Let me look into that.','I will take a look.','Let me work through that.']
          base='https://gravity-migration--gravity-leadership-system.netlify.app/.netlify/functions/gravity-tts'
          folder=pathlib.Path('site/assets/audio/gravity-ack')
          for i,line in enumerate(lines,1):
            file=folder/f'cedar-{i:02d}.mp3'
            if file.exists() and file.stat().st_size>1000:continue
            payload=json.dumps({'text':line,'voice':'cedar','speed':.98}).encode()
            req=urllib.request.Request(base,data=payload,headers={'Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=45) as response:
              audio=response.read()
              if response.status!=200 or 'audio' not in response.headers.get('Content-Type','') or len(audio)<1000:raise RuntimeError('Invalid Cedar audio '+str(i))
              file.write_bytes(audio)
            time.sleep(.5)
          print('Prepared',len(lines),'Cedar MP3 assets')
          PY
      - name: Commit staging-only audio assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/audio/gravity-ack
          if ! git diff --cached --quiet; then
            git commit -m 'assets(gravity): add prerecorded Cedar acknowledgment clips [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
