name: Comprehensive audit fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/comprehensive-audit-fixes.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply comprehensive audit repairs
        run: node scripts/comprehensive-audit-fixes.cjs
      - name: Rebuild sitemap
        run: node scripts/update-sitemap.cjs
      - name: Refresh source manifest
        run: npm run manifest
      - name: Verify controlled source
        run: npm run build
      - name: Commit verified repairs
        run: |
          if git diff --quiet; then
            echo 'No audit repairs needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site source-manifest.json
          git commit -m 'Repair AI search, privacy, and search hygiene from comprehensive audit'
          git push
