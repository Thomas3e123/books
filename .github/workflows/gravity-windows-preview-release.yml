name: Gravity Windows Preview Release (verified candidates)
# The pinned Windows candidate workflows validate the exact telemetry source and packaged builds.
# Do not gate release on the repository-wide source manifest here: the main-branch manifest has unrelated stale entries (starting at netlify.toml).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gravity-windows-preview-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-verified-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: gravity-windows-preview-2026-11-13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check scoped web/Windows parity
        run: |
          node scripts/check-web-windows-parity.cjs
      - name: Confirm exact successful Windows candidate runs and source SHAs
        shell: bash
        run: |
          set -euo pipefail
          runs=(
            '43488212962:59066649a65a0bef9404d627741cd78be30f036f'
            '43488213084:59066649a65a0bef9404d627741cd78be30f036f'
            '43488213233:59066649a65a0bef9404d627741cd78be30f036f'
            '43488213228:59066649a65a0bef9404d627741cd78be30f036f'
          )
          for pair in "${runs[@]}"; do
            id="${pair%%:*}"
            expected="${pair#*:}"
            state="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '[.status,.conclusion,.head_sha] | join(":")')"
            test "$state" = "completed:success:$expected" || { echo "::error::Candidate $id has incorrect verification state: $state"; exit 1; }
            echo "Verified immutable Windows candidate run $id."
          done
      - name: Download four independently tested candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/sop stage/inventory stage/shift stage/study
          gh run download 43488212962 -n Gravity-SOP-Foundry-Windows-Candidate -D stage/sop
          gh run download 43488213084 -n Gravity-Inventory-Center-Windows-Candidate -D stage/inventory
          gh run download 43488213233 -n Gravity-Shift-Lab-Windows-Candidate -D stage/shift
          gh run download 43488213228 -n Gravity-Work-Study-Lab-Windows-Beta-v0.3.0 -D stage/study
      - name: Verify installers, ZIP integrity, and hashes
        shell: bash
        run: |
          set -euo pipefail
          for p in sop inventory shift study; do
            count_exe="$(find "stage/$p" -maxdepth 1 -type f -name '*.exe' | wc -l)"
            count_zip="$(find "stage/$p" -maxdepth 1 -type f -name '*.zip' | wc -l)"
            test "$count_exe" -eq 1 && test "$count_zip" -eq 1 || { echo "::error::$p must contain one installer and one ZIP"; exit 1; }
            while IFS= read -r archive; do unzip -tqq "$archive"; done < <(find "stage/$p" -maxdepth 1 -name '*.zip')
          done
          find stage -type f \( -name '*.exe' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 8
          cat SHA256SUMS.txt
      - name: Prepare Windows preview release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          # Gravity Windows test-preview candidates — November 13, 2026

          Four **unsigned Windows x64 preview candidates**, kept separate from existing releases. The updated versions add limited product-usage measurement when connected to the internet: app opens, generic button/form interactions, and recent activity while the app is visible. They send a random app-install identifier, product, version, and event time. They do not send typed values, control labels, saved files, restaurant profiles, or work contents. Offline events are not queued. Do Not Track and the documented disable flag are honored.

          - SOP Foundry: 0.1.0-beta.2; build run 43488212962.
          - Inventory Center: 0.1.0-beta.2; build run 43488213084.
          - Shift Lab: 0.1.0-beta.2; build run 43488213233.
          - Work Study Lab: 0.3.0-beta.2; build run 43488213228.

          **Important:** Customer migration from older Windows data profiles, actual printer/scanner operation, and Windows 10/11 customer-device checks remain unverified. These installs may use different application profiles. Export and protect all existing data before installing any preview. Do not uninstall or overwrite an existing working installation. Hosted employee/voice/portable functions require internet and must be tested in the actual restaurant environment. Windows SmartScreen can warn about unsigned software.

          Assets include one NSIS installer and one ZIP for each program, plus SHA256SUMS.txt. The October previews and legacy betas remain available.
          NOTES
      - name: Publish a separate prerelease without touching existing beta releases
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find stage -type f \( -name '*.exe' -o -name '*.zip' \) -print0 | sort -z)
          test "${#assets[@]}" -eq 8
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preview tag already exists; refusing to overwrite published release assets."
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title 'Gravity Windows — Usage Measurement Previews (November 13, 2026)' \
            --notes-file RELEASE_NOTES.md
          assets_count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          test "$assets_count" -eq 9 || { echo "::error::Preview release is incomplete; leaving draft."; exit 1; }
          gh release edit "$TAG" --draft=false --prerelease
          echo "Published separated prerelease with $assets_count verified assets."
