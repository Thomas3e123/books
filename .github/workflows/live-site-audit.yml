name: Live production site audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-site-audit.yml'
permissions:
  contents: read
jobs:
  live-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live production routes, security, API boundaries, and Windows assets
        run: node scripts/live-site-audit.cjs
# final clean-room rerun 2026-10-14
