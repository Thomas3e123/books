name: Gravity Work Study Lab Windows Beta

on:
  workflow_dispatch:
    inputs:
      publish_beta:
        description: 'Replace the rolling Windows beta only after every v0.3 runtime gate passes'
        required: true
        default: false
        type: boolean
  push:
    branches: [main, gravity-work-study-windows-parity-20261019, 'feature/gravity-migration-phase1-2026-10-22']
    paths:
      - 'windows/gravity-work-study-lab/**'
      - 'site/gravity-work-study-lab.html'
      - 'site/assets/js/gravity-work-study-*.js'
      - 'site/assets/css/gravity-work-study-v2.css'
      - 'functions/work-study-link/**'
      - 'netlify/database/migrations/20261017183000_work_study_device_link.sql'
      - 'scripts/upgrade-work-study-lab-v2.cjs'
      - 'scripts/work-study-guided-stability-suite.cjs'
      - 'scripts/work-study-device-link-suite.cjs'
      - '.github/workflows/work-study-lab-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/gravity-work-study-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Synchronize website expert brain into Windows
        run: npm run sync:expert
      - name: Verify website Guided bootstrap matches protected Windows stack
        shell: pwsh
        run: |
          $html = Get-Content '../../site/gravity-work-study-lab.html' -Raw
          $guard = $html.IndexOf('src="/assets/js/gravity-work-study-mutation-guard-v62.js')
          $core = $html.IndexOf('src="/assets/js/gravity-work-study-v2.js')
          $guided = $html.IndexOf('src="/assets/js/gravity-work-study-guided-entry-v63.js')
          if ($guard -lt 0 -or $core -lt 0 -or $guided -lt 0 -or $guard -ge $core -or $core -ge $guided) {
            throw 'Website Guided bootstrap order differs from guarded Windows stack'
          }
          Write-Host 'Website and Windows Guided bootstrap order verified.'
      - name: Verify Guided-stable full expert parity through v63
        run: npm run verify:expert
      - name: Syntax check Windows shell and portable-device bridge
        shell: pwsh
        run: |
          node --check bootstrap.js
          node --check main.js
          node --check device-link-main.js
          node --check preload.js
          node --check desktop-bridge.js
          node --check device-link.js
          node --check expert-loader.js
          Get-ChildItem expert\*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Verify required expert, stability, and portable-device layers
        shell: pwsh
        run: |
          $required = @(
            'gravity-work-study-mutation-guard-v62.js',
            'gravity-work-study-guided-entry-v63.js',
            'gravity-work-study-clock-control-v32.js',
            'gravity-work-study-standard-minutes-v33.js',
            'gravity-work-study-evidence-package-v56.js',
            'gravity-work-study-ergonomics-v57.js',
            'gravity-work-study-learning-curve-v58.js',
            'gravity-work-study-context-conditions-v59.js',
            'gravity-work-study-sustainable-pace-v60.js',
            'gravity-work-study-expert-triage-v61.js'
          )
          foreach ($name in $required) { if (-not (Test-Path (Join-Path 'expert' $name))) { throw "Missing required expert layer: $name" } }
          if (-not (Select-String -Path expert\gravity-work-study-process-map-v34.js -Pattern 'gravityDesktop?.readProcessFile' -SimpleMatch -Quiet)) { throw 'Windows DOCX reader was not routed through the Electron bridge.' }
          if (-not (Select-String -Path expert\gravity-work-study-earbud-mode-v18.js -Pattern 'gravityDesktop?.requestTts' -SimpleMatch -Quiet)) { throw 'Windows Guided Cedar voice was not routed through the Electron bridge.' }
          if (-not (Select-String -Path main.js -Pattern "ipcMain.handle('tts:request'" -SimpleMatch -Quiet)) { throw 'Windows Cedar TTS main-process bridge is missing.' }
          if (-not (Select-String -Path main.js -Pattern "https://gravityleadershipsystem.com/.netlify/functions/gravity-tts" -SimpleMatch -Quiet)) { throw 'Windows Cedar TTS must use the HTTPS hosted path from the Electron main process.' }
          if (-not (Select-String -Path main.js -Pattern "ipcMain.handle('evidence:save'" -SimpleMatch -Quiet)) { throw 'Durable Windows evidence backup is missing.' }
          if (-not (Select-String -Path desktop-bridge.js -Pattern 'loadLatestEvidencePackage' -SimpleMatch -Quiet)) { throw 'Windows backup restore bridge is missing.' }
          if (-not (Select-String -Path device-link-main.js -Pattern "ipcMain.handle('device-link:create'" -SimpleMatch -Quiet)) { throw 'Windows portable-device main-process bridge is missing.' }
          if (-not (Select-String -Path device-link-main.js -Pattern 'https://gravityleadershipsystem.com/work-study-link' -SimpleMatch -Quiet)) { throw 'Windows portable-device sync must use the hosted HTTPS route through Electron main.' }
          if (Select-String -Path preload.js -Pattern 'ownerToken' -SimpleMatch -Quiet) { throw 'Private portable-device owner token must not be exposed to the renderer.' }
          if (-not (Select-String -Path device-link.js -Pattern 'Bring Back Latest' -SimpleMatch -Quiet)) { throw 'Windows portable-device conflict recovery UI is missing.' }
          if (-not (Select-String -Path expert\gravity-work-study-mutation-guard-v62.js -Pattern "v62-global-cohort" -SimpleMatch -Quiet)) { throw 'Cross-observer Guided mutation-loop protection is missing.' }
          if (-not (Select-String -Path expert\gravity-work-study-guided-entry-v63.js -Pattern 'Click Guided once, then wait for Gravity to join you before clicking anything else.' -SimpleMatch -Quiet)) { throw 'Exact Guided click-once instruction is missing.' }
      - name: Run shared portable-device integrity regression
        working-directory: ${{ github.workspace }}
        run: node scripts/work-study-device-link-suite.cjs
      - name: Run actual Windows Guided + durability + Cedar runtime smoke
        shell: pwsh
        run: |
          $env:GRAVITY_GUIDED_SMOKE = '1'
          npx electron .
      - name: Build Windows installer and ZIP
        run: npm run build:win
      - name: Check ZIP and generate SHA-256 for the private Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in @('.exe','.zip') })
          if ($files.Count -ne 2) { throw "Expected one EXE and one ZIP; found $($files.Count)" }
          $exe = @($files | Where-Object { $_.Extension -eq '.exe' })
          $zip = @($files | Where-Object { $_.Extension -eq '.zip' })
          if ($exe.Count -ne 1 -or $zip.Count -ne 1) { throw 'Incomplete Windows candidate' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip[0].FullName)
          try { if ($archive.Entries.Count -lt 2) { throw 'Windows ZIP missing packaged files' } }
          finally { $archive.Dispose() }
          $lines = @($files | Sort-Object Name | ForEach-Object {
            $sum=(Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            "$sum  $($_.Name)"
          })
          Set-Content -Path 'dist/SHA256SUMS.txt' -Value $lines -Encoding utf8
          if (@(Get-Content 'dist/SHA256SUMS.txt').Count -ne 2) { throw 'Checksum file incomplete' }
          Write-Host "Verified Windows candidate ZIP; created SHA-256 file for 2 distributions."
      - name: Install candidate on clean Windows and rerun Guided data integrity smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'dist/Gravity_Work_Study_Lab_*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Work Study installer missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'gravity-work-study-installed-smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Work Study installation failed: $($install.ExitCode)" }
          $installed = Join-Path $destination 'Gravity Work Study Lab.exe'
          if (-not (Test-Path $installed)) { throw "Installed Work Study executable missing: $installed" }
          $env:GRAVITY_GUIDED_SMOKE = '1'
          $stdout = Join-Path $env:RUNNER_TEMP 'gravity-work-study-installed-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'gravity-work-study-installed-err.txt'
          $run = Start-Process -FilePath $installed -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path $stdout) { Get-Content $stdout | Select-Object -Last 80 }
          if (Test-Path $stderr) { Get-Content $stderr | Select-Object -Last 80 }
          if ($run.ExitCode -ne 0) { throw "Installed Work Study runtime smoke failed: $($run.ExitCode)" }
          Write-Host 'Installed Work Study Guided smoke passed on clean Windows runner.'
      - name: Upload Windows beta candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-Work-Study-Lab-Windows-Beta-v0.3.0
          path: |
            windows/gravity-work-study-lab/dist/*.exe
            windows/gravity-work-study-lab/dist/*.zip
            windows/gravity-work-study-lab/dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish rolling Windows beta release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_beta == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete work-study-windows-beta --yes --cleanup-tag || true
          gh release create work-study-windows-beta dist/*.exe dist/*.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Gravity Work Study Lab Windows Beta v0.3.0" \
            --notes "Windows beta v0.3 is published only after Guided responsiveness, Windows-local complete-evidence save/reload, Cedar main-process TTS, and portable-device integrity gates pass. Portable device sync uses a short-lived hosted connection while preserving Windows-local durable evidence and revision conflict protection. Guided instruction: Click Guided once, then wait for Gravity to join you before clicking anything else. Unsigned beta: Windows SmartScreen may warn. Hosted Cedar voice, DOCX extraction, and portable-device sync require internet access."
