name: Gravity LIVE domain — final HTTPS, www, MX and Foundry verification (READ ONLY)
on:
  push:
    branches: ['feature/gravity-migration-phase1-2026-10-22']
    paths: ['.github/workflows/gravity-domain-https-final-check-2026-10-26.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custom-domain-live:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test DNS, apex HTTPS certificate, www redirect, Google Workspace MX and Foundry health
        env:
          GRAVITY_DNS_EXPECT_CUTOVER: '1'
        run: node scripts/check-gravity-domain-dns.cjs
      - name: Diagnose HTTPS certificate and redirect for apex and WWW independently
        if: always()
        shell: bash
        run: |
          set +e
          for host in gravityleadershipsystem.com www.gravityleadershipsystem.com; do
            echo "GRAVITY_TLS_DIAG_HOST $host"
            dig +short "$host" A
            dig +short "$host" CNAME
            curl --silent --show-error --location --max-time 20 --head --output /dev/null --write-out 'GRAVITY_TLS_RESULT %{url_effective} HTTP=%{http_code} SSL_VERIFY=%{ssl_verify_result} REMOTE_IP=%{remote_ip}\n' "https://$host/" 2>&1 | head -20
            echo "GRAVITY_TLS_DIAG_END $host"
          done
          curl --silent --show-error --max-time 20 --output /dev/null --write-out 'GRAVITY_FOUNDRY_APEX_HEALTH %{http_code}\n' https://gravityleadershipsystem.com/foundry-hosted/health
      - name: Read current Netlify TLS certificate coverage (NO WRITES)
        if: always()
        env:
          TOKEN_A: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          TOKEN_B: ${{ secrets.NETLIFY_TOKEN }}
          TOKEN_C: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
        shell: bash
        run: |
          set +e
          token="${TOKEN_A:-${TOKEN_B:-${TOKEN_C:-}}}"
          if [ -z "$token" ]; then echo 'NETLIFY_CERT_LOOKUP_SKIPPED: no token configured'; exit 0; fi
          file=$(mktemp)
          code=$(curl --silent --show-error --max-time 20 --output "$file" -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/json' "https://api.netlify.com/api/v1/sites/fa5d39a0-bef9-4ff1-9c28-57d585d741d7/ssl")
          if [ "$code" = 200 ]; then
            CERT_FILE="$file" node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.CERT_FILE,'utf8'));
          const summary={state:x.state,domains:x.domains,created_at:x.created_at,updated_at:x.updated_at,expires_at:x.expires_at};
          console.log('NETLIFY_SITE_CERTIFICATE '+JSON.stringify(summary));
          NODE
          else
            echo "NETLIFY_SITE_CERTIFICATE_LOOKUP_HTTP $code"
            head -c 300 "$file"
            echo
          fi
          rm -f "$file"
          echo 'SNI CERTIFICATE LEAF SUBJECTS (NO SECRETS)'
          for host in gravityleadershipsystem.com www.gravityleadershipsystem.com; do
            echo "$host"
            echo | timeout 15 openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null | openssl x509 -noout -subject -dates -ext subjectAltName 2>&1 | head -16
          done
      - name: Verify public pages are currently blocked from search indexing until final approval
        shell: bash
        run: |
          set -euo pipefail
          base='https://gravityleadershipsystem.com'
          for page in / /books /book-reader /register /gravity-report /windows-programs; do
            headers=$(mktemp)
            code=$(curl --max-time 25 --fail --silent --show-error --location -D "$headers" -o /dev/null -w '%{http_code}' "$base$page")
            test "$code" = 200
            grep -qi '^x-robots-tag: noindex, nofollow' "$headers" || { echo "FAIL: noindex absent from $page"; exit 1; }
            echo "GRAVITY LIVE DOMAIN OK, NOINDEX STILL ACTIVE $page"
            rm -f "$headers"
          done
          curl --fail --silent --show-error --max-time 25 "$base/robots.txt" | grep -Fq 'Disallow: /'
          echo 'GRAVITY LIVE HTTPS AND NOINDEX VERIFIED. DO NOT PUBLICLY INDEX SITE WITHOUT FURTHER APPROVAL.'
