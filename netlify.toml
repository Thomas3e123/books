# Thomas Monroe Books — isolated publishing website and optional paid digital catalog.
# Gravity retains a separate production branch and independent Netlify project.
[build]
  publish = "tmb-site"
  command = "node scripts/build-tmb-store.mjs && node scripts/verify-tmb-publisher.cjs"

[build.environment]
  NODE_VERSION = "22"

# Explicit function directory prevents accidental publication of Gravity platform functions on TMB.
[functions]
  directory = "tmb-functions"
  node_bundler = "esbuild"
  included_files = [
    "site/assets/downloads/quiet-gravity-gravity-elite-2026-09-11-155-pages.pdf",
    "site/assets/downloads/the-owners-chair-gravity-elite-2026-09-11-212-pages.pdf",
    "site/assets/downloads/systems-of-service-gravity-elite-v2-2026-09-11-253-pages.pdf",
    "site/assets/downloads/employee-training-sop-tracker-gravity-elite-v2-2026-09-12-257-interior-pages.pdf",
    "site/assets/downloads/labor-control-scheduling-planner-gravity-elite-v2-2026-09-12-371-interior-372-digital-pages.pdf",
    "site/assets/downloads/restaurant-sop-station-operations-builder-gravity-elite-v3-2026-09-13-258-pages.pdf",
    "site/assets/downloads/gravity-restaurant-sop-library-volume-1-gravity-elite-v2-2026-09-13-369-pages.pdf",
    "site/assets/downloads/gravity-restaurant-sop-library-volume-2-gravity-elite-v2-2026-09-13-370-pages.pdf",
    "site/assets/downloads/gravity-restaurant-sop-library-volume-3-specialty-advanced-hard-to-find-sops.pdf",
    "site/assets/downloads/food-cost-waste-inventory-control-318-pages.pdf",
    "site/assets/downloads/hiring-interviewing-employee-retention-tracker-gravity-elite-208-pages.pdf",
    "site/assets/downloads/guest-service-complaints-recovery-workbook-gravity-elite-2026-09-13-191-pages.pdf",
    "site/assets/downloads/GRAVITY_Restaurant_Bar_Beverage_Pour_Cost_Control_v1.0.pdf",
    "site/assets/downloads/GRAVITY_Restaurant_Bar_Beverage_Inventory_Ordering_v1.0.pdf",
    "site/assets/free-resources/ai/RESTAURANT_AI_PROMPTS_AND_SYSTEMS_WORKBOOK_350_PROMPTS_2026-11-03.pdf",
  ]
